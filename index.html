<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#0a0602">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="ARKANA">
<meta name="description" content="ARKANA — ein mystisches Retro-Adventure. Finde dein verborgenes Muster.">
<title>ARKANA — Das verborgene Muster</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body {
  width: 100%; height: 100%; overflow: hidden;
  background: #050301; touch-action: none;
  font-family: 'Courier New', ui-monospace, monospace;
  overscroll-behavior: none;
  -webkit-user-select: none; user-select: none;
}
#wrap { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; }
#game {
  image-rendering: pixelated; image-rendering: crisp-edges;
  background: #050301; display: block;
}
#scanlines { position: absolute; pointer-events: none; mix-blend-mode: multiply; opacity: 0.75; }

/* Touch-Steuerung liegt als Overlay über dem Bild, kostet also keine Fläche */
#touchzone { position: fixed; inset: 0; z-index: 5; display: none; }
body.touch #touchzone { display: block; }

#stick {
  position: fixed; width: 120px; height: 120px; z-index: 6; display: none;
  pointer-events: none; border: 2px solid rgba(255,140,0,0.30); border-radius: 50%;
  background: radial-gradient(circle, rgba(255,140,0,0.10), rgba(255,140,0,0.02));
}
#stick-knob {
  position: absolute; left: 38px; top: 38px; width: 44px; height: 44px;
  border-radius: 50%; background: rgba(255,140,0,0.42);
  border: 2px solid rgba(255,180,71,0.75);
}
#pad { position: fixed; inset: 0; pointer-events: none; display: none; z-index: 7; }
body.touch #pad { display: block; }
.pbtn {
  position: absolute; pointer-events: auto;
  border: 2px solid rgba(255,140,0,0.45); border-radius: 50%;
  background: rgba(255,140,0,0.12); color: rgba(255,232,194,0.9);
  display: flex; align-items: center; justify-content: center;
  font-family: 'Courier New', monospace; font-weight: bold;
  transition: background 0.08s, transform 0.08s;
}
.pbtn:active, .pbtn.on { background: rgba(255,140,0,0.42); transform: scale(0.93); }
#p-a { right: 22px; bottom: calc(84px + env(safe-area-inset-bottom, 0px)); width: 88px; height: 88px; font-size: 19px; }
#p-b { right: 34px; bottom: calc(14px + env(safe-area-inset-bottom, 0px)); width: 62px; height: 62px; font-size: 13px; }
/* Steuerkreuz nur am Rechner sichtbar, am Handy übernimmt der Stick */
#p-up, #p-down, #p-left, #p-right { display: none; }

#nameform {
  position: fixed; inset: 0; z-index: 20; display: none;
  align-items: center; justify-content: center; flex-direction: column;
  background: rgba(4,2,0,0.95); padding: 20px;
}
#nameform.show { display: flex; }
#nameform label { color: #ff8c00; font-size: 16px; letter-spacing: 3px; margin-bottom: 20px; text-align: center; line-height: 1.7; }
#nameform input {
  background: #1a0d05; border: 2px solid #cc6600; color: #ffe8c2;
  font-family: 'Courier New', monospace; font-size: 24px; text-align: center;
  padding: 14px; width: min(80vw, 320px); outline: none; border-radius: 4px;
}
#nameform input:focus { border-color: #ff8c00; box-shadow: 0 0 14px rgba(255,140,0,0.35); }
#nameform button {
  margin-top: 22px; background: #ff8c00; border: none; color: #1a0d05;
  font-family: 'Courier New', monospace; font-size: 17px; font-weight: bold;
  padding: 14px 40px; border-radius: 4px; letter-spacing: 3px;
}
</style>
</head>
<body>
<div id="wrap">
  <canvas id="game" width="360" height="640"></canvas>
  <div id="scanlines"></div>
</div>
<div id="touchzone"></div>
<div id="stick"><div id="stick-knob"></div></div>
<div id="pad">
  <div class="pbtn" id="p-up">▲</div>
  <div class="pbtn" id="p-down">▼</div>
  <div class="pbtn" id="p-left">◀</div>
  <div class="pbtn" id="p-right">▶</div>
  <div class="pbtn" id="p-a">OK</div>
  <div class="pbtn" id="p-b">MENÜ</div>
</div>
<div id="nameform">
  <label id="nameform-label">WIE LAUTET DEIN NAME?</label>
  <input id="nameform-input" maxlength="16" autocomplete="off" autocapitalize="words" spellcheck="false">
  <button id="nameform-ok">WEITER</button>
</div>
<script>
// ===== 01_core.js =====
'use strict';
// ============================================================
// ARKANA Core: 9:16 Hochformat, DPR-scharfes Rendering,
// Input, Engine, Partikel, Text
// ============================================================
const G = {};

// --- Auflösung ---
// Breite fest 360. Spielfeld immer 15x22 Tiles à 24px, damit alle
// Spieler exakt gleich viel sehen. Die Höhe wächst mit dem Gerät:
// auf langen Handys (19.5:9) wird der HUD-Bereich größer, statt
// schwarze Balken zu lassen. Basis bleibt 9:16.
G.W = 360;
G.H_BASE = 640;          // 9:16 Referenz
G.H = G.H_BASE;
G.TILE = 40;             // groessere Kacheln = naeher dran
G.ROOM_W = 9; G.ROOM_H = 14;
G.FIELD_H = G.ROOM_H * G.TILE; // 560
G.HUD_Y = G.FIELD_H;
G.HUD_H = G.H - G.FIELD_H;
G.SAFE_Y = 0;            // Offset, um Vollbild-Menüs vertikal zu zentrieren

// --- Paletten ---
G.PAL = {
  amber: {
    bg: '#1a0d05', bgDeep: '#0d0602', bgVoid: '#050301',
    card: '#2d1b0e', cardLight: '#3d2817', cardHi: '#4d3420',
    main: '#ff8c00', bright: '#ffa500', glow: '#ffb347', dim: '#cc6600',
    text: '#ffd580', textBright: '#ffe8c2', textDim: '#ad6e21',
    accent: '#7ec97e', danger: '#d96a6a',
  },
  gray: {
    bg: '#15161a', bgDeep: '#0b0c0e', bgVoid: '#050506',
    card: '#22242a', cardLight: '#2e3138', cardHi: '#3a3e46',
    main: '#8b8f99', bright: '#a8adb8', glow: '#c0c5d0', dim: '#565a63',
    text: '#9aa0ac', textBright: '#c7ccd6', textDim: '#5c616b',
    accent: '#7a86a0', danger: '#8a6a6a',
  },
};
G.pal = G.PAL.gray;

// Element-Färbung des Spielers, kommt aus dem Sternzeichen
G.ELEMENT_COLORS = {
  Feuer: { robe: '#c4502a', robeHi: '#e8703f', robeDark: '#6b2a16', trim: '#ffb347', core: '#ff8c00' },
  Wasser: { robe: '#2a5f7a', robeHi: '#3f86a8', robeDark: '#163544', trim: '#9fd8e8', core: '#7ec8e8' },
  Erde: { robe: '#4a5a2a', robeHi: '#6b803f', robeDark: '#283016', trim: '#c4d88a', core: '#a8c060' },
  Luft: { robe: '#5a4a7a', robeHi: '#7f6ba8', robeDark: '#312844', trim: '#d8c8f0', core: '#b89ee8' },
};

// --- Biome: jede Region hat eine eigene Farbwelt ---
// Erben von der Amber-Basis, überschreiben nur was anders sein soll.
G.BIOMES = {
  asche:   { bg:'#1a0d05', bgDeep:'#0d0602', bgVoid:'#050301', card:'#2d1b0e', cardLight:'#3d2817', cardHi:'#4d3420',
             main:'#ff8c00', bright:'#ffa500', glow:'#ffb347', dim:'#cc6600', text:'#ffd580', textBright:'#ffe8c2', textDim:'#ad6e21' },
  sumpf:   { bg:'#0d1a12', bgDeep:'#061009', bgVoid:'#030805', card:'#1a2d20', cardLight:'#26402e', cardHi:'#33543d',
             main:'#4fbf7f', bright:'#6fd99a', glow:'#8fe8b4', dim:'#2f8f5a', text:'#a8e0c0', textBright:'#d0f0dd', textDim:'#4a8f68' },
  kristall:{ bg:'#0f0d20', bgDeep:'#080614', bgVoid:'#04030a', card:'#1e1a3a', cardLight:'#2c2652', cardHi:'#3d356e',
             main:'#8a7fff', bright:'#a99cff', glow:'#c4baff', dim:'#5a4fbf', text:'#c0b8f0', textBright:'#e0dcff', textDim:'#6a5fa0' },
  wueste:  { bg:'#241a0e', bgDeep:'#160f07', bgVoid:'#0a0704', card:'#3d2d17', cardLight:'#54401f', cardHi:'#6e552b',
             main:'#e8b040', bright:'#ffc960', glow:'#ffdb8f', dim:'#a87c28', text:'#f0d89a', textBright:'#fff0c8', textDim:'#a08850' },
  sternen: { bg:'#08101f', bgDeep:'#040914', bgVoid:'#02050a', card:'#12203a', cardLight:'#1b2e52', cardHi:'#264070',
             main:'#5fa8ff', bright:'#8ac4ff', glow:'#b4dcff', dim:'#3a6fb0', text:'#a8ccf0', textBright:'#d8ecff', textDim:'#5a7fa8' },
  bibliothek:{ bg:'#1c1208', bgDeep:'#100a05', bgVoid:'#070402', card:'#33230f', cardLight:'#4a3418', cardHi:'#664824',
             main:'#d99a4a', bright:'#f0b468', glow:'#ffcd90', dim:'#996b30', text:'#e8c895', textBright:'#ffe4c0', textDim:'#9a7a50' },
  mond:    { bg:'#101420', bgDeep:'#080b14', bgVoid:'#040609', card:'#1e2436', cardLight:'#2c344c', cardHi:'#3d4766',
             main:'#c0d0e8', bright:'#dce6f5', glow:'#f0f5ff', dim:'#7f8fa8', text:'#c8d4e4', textBright:'#eaf0fa', textDim:'#7a8496' },
  unterwelt:{ bg:'#1a0808', bgDeep:'#100404', bgVoid:'#080202', card:'#2e1212', cardLight:'#421c1a', cardHi:'#5c2824',
             main:'#e0503f', bright:'#f5705a', glow:'#ff9480', dim:'#a03428', text:'#e8a898', textBright:'#ffd0c4', textDim:'#9a5a4c' },
  hain:    { bg:'#12180c', bgDeep:'#0a0f07', bgVoid:'#050803', card:'#22301a', cardLight:'#324528', cardHi:'#455e36',
             main:'#9fd94f', bright:'#bce870', glow:'#d6f79a', dim:'#6a9a33', text:'#c8e4a0', textBright:'#e8f8cc', textDim:'#7a9a58' },
  grau:    { bg:'#15161a', bgDeep:'#0b0c0e', bgVoid:'#050506', card:'#22242a', cardLight:'#2e3138', cardHi:'#3a3e46',
             main:'#8b8f99', bright:'#a8adb8', glow:'#c0c5d0', dim:'#565a63', text:'#9aa0ac', textBright:'#c7ccd6', textDim:'#5c616b' },
};
// Fehlende Schlüssel aus Amber ergänzen, damit nichts undefined ist
for (const b of Object.values(G.BIOMES)) {
  for (const k in G.PAL.amber) if (b[k] === undefined) b[k] = G.PAL.amber[k];
}

// --- Einstellungen ---
G.settings = { crt: true, partikel: true };

// --- Canvas, DPR-bewusst ---
G.canvas = document.getElementById('game');
G.ctx = G.canvas.getContext('2d', { alpha: false });
G.ctx.imageSmoothingEnabled = false;

function fitCanvas() {
  const vw = window.innerWidth, vh = window.innerHeight;

  // Interne Höhe an das Geräteverhältnis anpassen, damit der Bildschirm
  // ohne Balken gefüllt wird. Das Spielfeld bleibt konstant, nur das
  // HUD wächst. Begrenzt, damit das Layout nicht auseinanderfällt.
  const wanted = Math.round(G.W * (vh / vw) / 2) * 2;
  G.H = Math.max(G.H_BASE, Math.min(wanted, 860));
  G.HUD_H = G.H - G.FIELD_H;
  G.SAFE_Y = Math.round((G.H - G.H_BASE) / 2);

  const scale = Math.min(vw / G.W, vh / G.H);
  const cssW = Math.round(G.W * scale), cssH = Math.round(G.H * scale);
  G.canvas.style.width = cssW + 'px';
  G.canvas.style.height = cssH + 'px';

  // Backing-Store an das physische Pixelraster koppeln: scharfe Kanten
  // auch auf Retina, ohne dass der Browser weichzeichnet.
  const dpr = Math.min(window.devicePixelRatio || 1, 3);
  const bw = Math.round(cssW * dpr), bh = Math.round(cssH * dpr);
  if (G.canvas.width !== bw || G.canvas.height !== bh) {
    G.canvas.width = bw; G.canvas.height = bh;
  }
  G.renderScale = bw / G.W;
  G.ctx.imageSmoothingEnabled = false;

  const sl = document.getElementById('scanlines');
  const r = G.canvas.getBoundingClientRect();
  sl.style.left = r.left + 'px'; sl.style.top = r.top + 'px';
  sl.style.width = cssW + 'px'; sl.style.height = cssH + 'px';
  sl.style.display = G.settings.crt ? 'block' : 'none';
  // Scanline-Dichte an die Skalierung koppeln, sonst moiriert es
  const period = Math.max(2, Math.round(scale * 2));
  sl.style.backgroundImage = `repeating-linear-gradient(0deg, rgba(0,0,0,0.20) 0px, rgba(0,0,0,0.20) ${period / 2}px, transparent ${period / 2}px, transparent ${period}px)`;
}
window.addEventListener('resize', () => fitCanvas());
window.addEventListener('orientationchange', () => setTimeout(fitCanvas, 100));

// --- Input: Tastatur, Touch-Pad, Wischen ---
G.input = (() => {
  const held = {}; const pressed = {};
  // Analoger Richtungsvektor, damit die Figur weich beschleunigt
  const vec = { x: 0, y: 0 };
  const map = {
    ArrowUp: 'up', ArrowDown: 'down', ArrowLeft: 'left', ArrowRight: 'right',
    w: 'up', s: 'down', a: 'left', d: 'right', W: 'up', S: 'down', A: 'left', D: 'right',
    Enter: 'action', ' ': 'action', e: 'action', E: 'action',
    Escape: 'cancel', q: 'cancel', Q: 'cancel',
  };
  window.addEventListener('keydown', (e) => {
    const k = map[e.key];
    if (!k) return;
    e.preventDefault();
    if (!held[k]) pressed[k] = true;
    held[k] = true;
  });
  window.addEventListener('keyup', (e) => { const k = map[e.key]; if (k) held[k] = false; });

  function bindBtn(id, key) {
    const el = document.getElementById(id);
    if (!el) return;
    const on = (e) => { e.preventDefault(); if (!held[key]) pressed[key] = true; held[key] = true; el.classList.add('on'); };
    const off = (e) => { e.preventDefault(); held[key] = false; el.classList.remove('on'); };
    el.addEventListener('touchstart', on, { passive: false });
    el.addEventListener('touchend', off, { passive: false });
    el.addEventListener('touchcancel', off, { passive: false });
    el.addEventListener('mousedown', on);
    el.addEventListener('mouseup', off);
    el.addEventListener('mouseleave', off);
  }
  if ('ontouchstart' in window || navigator.maxTouchPoints > 0) document.body.classList.add('touch');
  ['up', 'down', 'left', 'right'].forEach((d) => bindBtn('p-' + d, d));
  bindBtn('p-a', 'action'); bindBtn('p-b', 'cancel');

  // Virtueller Stick: Daumen irgendwo auf der linken Bildhälfte aufsetzen
  const stick = { active: false, id: null, cx: 0, cy: 0, dx: 0, dy: 0 };
  const stickEl = document.getElementById('stick');
  const knobEl = document.getElementById('stick-knob');
  function stickStart(e) {
    for (const t of e.changedTouches) {
      if (t.clientX > window.innerWidth * 0.55) continue; // rechte Hälfte = Aktionen
      stick.active = true; stick.id = t.identifier;
      stick.cx = t.clientX; stick.cy = t.clientY;
      stickEl.style.display = 'block';
      stickEl.style.left = (stick.cx - 60) + 'px';
      stickEl.style.top = (stick.cy - 60) + 'px';
      knobEl.style.transform = 'translate(0px,0px)';
      e.preventDefault();
      break;
    }
  }
  function stickMove(e) {
    if (!stick.active) return;
    for (const t of e.changedTouches) {
      if (t.identifier !== stick.id) continue;
      let dx = t.clientX - stick.cx, dy = t.clientY - stick.cy;
      const len = Math.hypot(dx, dy), max = 46;
      if (len > max) { dx = dx / len * max; dy = dy / len * max; }
      stick.dx = dx / max; stick.dy = dy / max;
      knobEl.style.transform = `translate(${dx}px,${dy}px)`;
      e.preventDefault();
      break;
    }
  }
  function stickEnd(e) {
    for (const t of e.changedTouches) {
      if (t.identifier !== stick.id) continue;
      stick.active = false; stick.dx = 0; stick.dy = 0;
      stickEl.style.display = 'none';
      break;
    }
  }
  const zone = document.getElementById('touchzone');
  if (zone) {
    zone.addEventListener('touchstart', stickStart, { passive: false });
    zone.addEventListener('touchmove', stickMove, { passive: false });
    zone.addEventListener('touchend', stickEnd, { passive: false });
    zone.addEventListener('touchcancel', stickEnd, { passive: false });
  }

  return {
    held: (k) => !!held[k],
    pressed: (k) => !!pressed[k],
    // Richtungsvektor aus Stick oder Tasten, normalisiert
    dir() {
      if (stick.active && (Math.abs(stick.dx) > 0.15 || Math.abs(stick.dy) > 0.15)) {
        return { x: stick.dx, y: stick.dy };
      }
      let x = 0, y = 0;
      if (held.left) x -= 1; if (held.right) x += 1;
      if (held.up) y -= 1; if (held.down) y += 1;
      const l = Math.hypot(x, y);
      if (l > 1) { x /= l; y /= l; }
      return { x, y };
    },
    endFrame: () => { for (const k in pressed) delete pressed[k]; },
    clearAll: () => { for (const k in held) held[k] = false; for (const k in pressed) delete pressed[k]; stick.active = false; stick.dx = 0; stick.dy = 0; if (stickEl) stickEl.style.display = 'none'; },
  };
})();

// --- Szenen-Stack ---
G.scenes = [];
G.pushScene = (s) => { G.scenes.push(s); if (s.enter) s.enter(); };
G.popScene = () => { const s = G.scenes.pop(); if (s && s.exit) s.exit(); };
G.replaceScene = (s) => { while (G.scenes.length) G.popScene(); G.pushScene(s); };
G.topScene = () => G.scenes[G.scenes.length - 1];

// --- Partikel-System (Asche, Funken, Staub) ---
G.particles = [];
G.spawnParticle = (p) => { if (G.settings.partikel && G.particles.length < 220) G.particles.push(p); };
G.updateParticles = (dt) => {
  for (let i = G.particles.length - 1; i >= 0; i--) {
    const p = G.particles[i];
    p.life -= dt;
    if (p.life <= 0) { G.particles.splice(i, 1); continue; }
    p.x += p.vx * dt; p.y += p.vy * dt;
    if (p.drift) p.x += Math.sin(p.life * p.drift) * 6 * dt;
    if (p.grav) p.vy += p.grav * dt;
  }
};
G.drawParticles = (c) => {
  for (const p of G.particles) {
    const a = Math.min(1, p.life / (p.fade || 1));
    c.globalAlpha = a * (p.alpha || 1);
    c.fillStyle = p.color;
    const s = p.size || 2;
    c.fillRect(Math.round(p.x), Math.round(p.y), s, s);
  }
  c.globalAlpha = 1;
};

// --- Bildschirm-Erschütterung ---
G.shake = { t: 0, mag: 0 };
G.doShake = (mag, dur) => { G.shake.mag = mag; G.shake.t = dur; };

// --- Game Loop (fester Timestep, rAF plus Fallback) ---
(() => {
  let last = performance.now(); let acc = 0; let lastTick = 0;
  const STEP = 1000 / 60;
  function tick() {
    const now = performance.now();
    lastTick = now;
    acc += Math.min(now - last, 100); last = now;
    let steps = 0;
    while (acc >= STEP && steps < 5) {
      const s = G.topScene();
      if (s) s.update(STEP / 1000);
      G.updateParticles(STEP / 1000);
      if (G.shake.t > 0) G.shake.t -= STEP / 1000;
      G.input.endFrame();
      acc -= STEP; steps++;
    }
    if (acc > STEP * 5) acc = 0;

    const ctx = G.ctx;
    ctx.save();
    ctx.scale(G.renderScale || 1, G.renderScale || 1);
    ctx.fillStyle = G.pal.bgVoid;
    ctx.fillRect(0, 0, G.W, G.H);
    if (G.shake.t > 0) {
      const m = G.shake.mag * (G.shake.t);
      ctx.translate(Math.round((Math.random() - 0.5) * m), Math.round((Math.random() - 0.5) * m));
    }
    const s = G.topScene();
    if (s) {
      if (s.translucent && G.scenes.length > 1) G.scenes[G.scenes.length - 2].draw(ctx);
      s.draw(ctx);
    }
    ctx.restore();
  }
  function frame() {
    // Eine Exception darf die rAF-Kette nicht abreissen, sonst friert
    // das Bild dauerhaft ein und man kommt nicht mal ins Menue zurueck.
    try { tick(); } catch (e) { console.error('Frame-Fehler:', e); }
    finally { requestAnimationFrame(frame); }
  }
  requestAnimationFrame(frame);
  setInterval(() => { try { if (performance.now() - lastTick > 50) tick(); } catch (e) { /* siehe oben */ } }, 33);
  G._tick = tick;
})();

// --- Text ---
G.FONT = "'Courier New', ui-monospace, monospace";
G.text = (ctx, str, x, y, color, size = 14, align = 'left', weight = '') => {
  ctx.font = `${weight} ${size}px ${G.FONT}`.trim();
  ctx.textAlign = align; ctx.textBaseline = 'top';
  ctx.fillStyle = color;
  ctx.fillText(str, x, y);
};
G.textGlow = (ctx, str, x, y, color, size = 14, align = 'center') => {
  ctx.save();
  ctx.shadowColor = color; ctx.shadowBlur = 8;
  G.text(ctx, str, x, y, color, size, align, 'bold');
  ctx.restore();
};
G.wrapText = (ctx, str, maxWidth, size = 14) => {
  ctx.font = `${size}px ${G.FONT}`;
  const words = str.split(' '); const lines = []; let line = '';
  for (const w of words) {
    const test = line ? line + ' ' + w : w;
    if (ctx.measureText(test).width > maxWidth && line) { lines.push(line); line = w; }
    else line = test;
  }
  if (line) lines.push(line);
  return lines;
};

// --- Vignette ---
G.vignette = (c, strength = 0.55) => {
  const g = c.createRadialGradient(G.W / 2, G.FIELD_H / 2, G.W * 0.28, G.W / 2, G.FIELD_H / 2, G.W * 0.85);
  g.addColorStop(0, 'rgba(0,0,0,0)');
  g.addColorStop(1, `rgba(0,0,0,${strength})`);
  c.fillStyle = g;
  c.fillRect(0, 0, G.W, G.FIELD_H);
};

// --- Zufall mit Seed ---
G.mulberry32 = (seed) => {
  let a = seed >>> 0;
  return () => {
    a |= 0; a = (a + 0x6D2B79F5) | 0;
    let t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
};
G.hashStr = (s) => {
  let h = 2166136261;
  for (let i = 0; i < s.length; i++) { h ^= s.charCodeAt(i); h = Math.imul(h, 16777619); }
  return h >>> 0;
};

// --- Spielstand ---
G.state = null;
G.save = () => { try { localStorage.setItem('arkana_save', JSON.stringify(G.state)); } catch (e) { /* ignoriert */ } };
G.load = () => {
  // Spielstaende aus aelteren Versionen duerfen das Spiel nicht kaputt
  // machen. Deshalb gegen einen frischen Zustand mergen und pruefen.
  try {
    const raw = localStorage.getItem('arkana_save');
    if (!raw) return null;
    const s = JSON.parse(raw);
    if (!s || typeof s !== 'object') return null;
    if (!s.area) return null;
    const base = G.newState();
    const merged = {
      ...base, ...s,
      stats: { ...base.stats, ...(s.stats || {}) },
      fragmente: Array.isArray(s.fragmente) ? s.fragmente : [],
      gelesen: (s.gelesen && typeof s.gelesen === 'object') ? s.gelesen : {},
      flags: (s.flags && typeof s.flags === 'object') ? s.flags : {},
    };
    if (typeof merged.px !== 'number' || !Number.isFinite(merged.px)) merged.px = base.px;
    if (typeof merged.py !== 'number' || !Number.isFinite(merged.py)) merged.py = base.py;
    // In Arkana ohne Signatur waere der Zustand unbrauchbar
    if (merged.phase === 'arkana' && !merged.sig) return null;
    return merged;
  } catch (e) { return null; }
};
G.clearSave = () => { try { localStorage.removeItem('arkana_save'); } catch (e) { /* ignoriert */ } };

// ------------------------------------------------------------
// CHARAKTER: organische Animation mit Feder-Physik
// ------------------------------------------------------------
// Ein Zustandsobjekt pro Figur. Die Animation entsteht aus
// überlagerten Schwingungen plus nachlaufenden Federn, nicht aus
// festen Einzelbildern. Dadurch wirkt die Bewegung weich.
G.newAnim = () => ({
  phase: 0,        // Laufzyklus 0..1
  speed: 0,        // aktuelle Geschwindigkeit 0..1
  dir: 'down',
  facing: 0,       // weicher Richtungswert für Drehung
  vx: 0, vy: 0,
  cloakX: 0, cloakY: 0, cloakVX: 0, cloakVY: 0, // Umhang, Feder
  hoodX: 0, hoodVX: 0,                          // Kapuze, Feder
  squash: 0, squashV: 0,                        // Stauchen beim Anlaufen/Stoppen
  breathe: Math.random() * 6.28,
  blink: 2 + Math.random() * 3,
  blinking: 0,
  stepFlash: 0,
});

// Federschritt: zieht "val" zu "target", mit Dämpfung
function spring(val, vel, target, stiff, damp, dt) {
  const a = (target - val) * stiff - vel * damp;
  vel += a * dt;
  val += vel * dt;
  return [val, vel];
}

G.updateAnim = (an, dt, vx, vy, moving) => {
  const sp = Math.hypot(vx, vy);
  an.vx = vx; an.vy = vy;

  // Geschwindigkeit weich nachziehen, das killt das Ruckeln beim Start
  const targetSpeed = moving ? Math.min(1, sp / 90) : 0;
  an.speed += (targetSpeed - an.speed) * Math.min(1, dt * 9);

  // Laufzyklus. Frequenz skaliert mit Tempo.
  if (an.speed > 0.02) an.phase = (an.phase + dt * (1.7 + an.speed * 2.1)) % 1;
  else an.phase += (0 - (an.phase % 1)) * Math.min(1, dt * 4); // sanft in Ruhepose

  // Blickrichtung
  if (moving && sp > 4) {
    if (Math.abs(vx) > Math.abs(vy)) an.dir = vx < 0 ? 'left' : 'right';
    else an.dir = vy < 0 ? 'up' : 'down';
  }
  const facingTarget = an.dir === 'left' ? -1 : an.dir === 'right' ? 1 : 0;
  an.facing += (facingTarget - an.facing) * Math.min(1, dt * 12);

  // Umhang läuft der Bewegung hinterher (Sekundäranimation)
  const cloakTargetX = -vx * 0.075, cloakTargetY = -vy * 0.055;
  [an.cloakX, an.cloakVX] = spring(an.cloakX, an.cloakVX, cloakTargetX, 130, 13, dt);
  [an.cloakY, an.cloakVY] = spring(an.cloakY, an.cloakVY, cloakTargetY, 130, 13, dt);

  // Kapuze schwingt leicht gegenläufig
  [an.hoodX, an.hoodVX] = spring(an.hoodX, an.hoodVX, -vx * 0.028, 190, 16, dt);

  // Squash beim Beschleunigen und Abbremsen
  const accel = targetSpeed - an.speed;
  [an.squash, an.squashV] = spring(an.squash, an.squashV, accel * 1.4, 210, 15, dt);

  // Atmen im Stand
  an.breathe += dt * (1.5 + an.speed * 1.2);

  // Blinzeln
  an.blink -= dt;
  if (an.blink <= 0) { an.blinking = 0.11; an.blink = 2.4 + Math.random() * 3.4; }
  if (an.blinking > 0) an.blinking -= dt;

  // Schrittmarker für Staubpartikel
  const st = Math.sin(an.phase * Math.PI * 2);
  const wasDown = an.stepFlash;
  an.stepFlash = (st < -0.9 && an.speed > 0.35) ? 1 : 0;
  return an.stepFlash && !wasDown;
};

} };

// ------------------------------------------------------------
// MENSCH. Sprite-Box 26 breit, 42 hoch. Füße bei py+40.
// Aufbau: Haar, Kopf, Hals, Rumpf, Arme, Beine, Stiefel.
// Die Bewegung entsteht aus einem echten Gehzyklus: jeder Fuß
// steht eine halbe Periode am Boden und schwingt eine halbe
// Periode durch die Luft. Daraus werden Knie, Hüfte, Schultern
// und Kopf abgeleitet. Nichts davon sind feste Einzelbilder.
// ------------------------------------------------------------

// Fußposition im Gehzyklus. t läuft 0..1.
// Rückgabe: x seitlicher Versatz, y Höhe über dem Boden (negativ = angehoben)
function footCycle(t, stride, lift) {
  t = ((t % 1) + 1) % 1;
  if (t < 0.5) {
    // Standphase: Fuß klebt am Boden und wandert nach hinten
    const k = t / 0.5;
    return { x: stride * (1 - 2 * k), y: 0, planted: true };
  }
  // Schwungphase: Fuß hebt ab, zieht nach vorn, setzt wieder auf
  const k = (t - 0.5) / 0.5;
  return { x: stride * (-1 + 2 * k), y: -lift * Math.sin(k * Math.PI), planted: false };
}

G.drawPlayer = (c, px, py, an, p, cols, glow) => {
  const R = Math.round;
  const sp = an.speed;
  const side = (an.dir === 'left' || an.dir === 'right');
  const face = an.dir === 'left' ? -1 : 1;
  const back = (an.dir === 'up');

  // Hautton, bewusst neutral gehalten
  const skin = '#c98f63', skinSh = '#9c6b45', skinHi = '#e0ab7d';
  const hair = '#3a2418', hairHi = '#57351f';
  const shirt = cols.robe, shirtHi = cols.robeHi, shirtDark = cols.robeDark || '#1a1410';
  const trim = cols.trim, core = cols.core;
  const pants = '#2e2a33', pantsHi = '#413c48';
  const boot = '#1a1512';

  // --- Gehzyklus ---
  const stride = 4.2 * sp;
  const lift = 3.4 * sp;
  const fA = footCycle(an.phase, stride, lift);          // vorderes/linkes Bein
  const fB = footCycle(an.phase + 0.5, stride, lift);    // hinteres/rechtes Bein

  // Körper sinkt bei jedem Aufsetzen leicht ein, steigt in der Mitte
  const bob = -Math.abs(Math.sin(an.phase * Math.PI * 2)) * 1.5 * sp + 0.8 * sp;
  const breath = Math.sin(an.breathe) * 0.6 * (1 - sp);
  // Gewichtsverlagerung im Stand
  const idleShift = Math.sin(an.breathe * 0.5) * 0.7 * (1 - sp);
  // Hüfte kippt zur Standbeinseite, Schultern gegenläufig
  const hipTilt = Math.sin(an.phase * Math.PI * 2) * 1.3 * sp;
  const shoulderTilt = -hipTilt * 0.75;

  const sq = an.squash;
  const sY = 1 - sq * 0.12, sX = 1 + sq * 0.09;

  const baseY = py + bob + breath;
  const cx = px + 13 + idleShift;
  const footY = py + 40;

  // --- Schatten ---
  c.globalAlpha = 0.36 - sp * 0.08;
  c.fillStyle = '#000';
  c.beginPath();
  c.ellipse(px + 13, footY + 1, (8 + sp * 2) * sX, 3, 0, 0, 6.283);
  c.fill();
  c.globalAlpha = 1;

  // --- Schimmer im Prolog ---
  if (glow) {
    c.globalAlpha = 0.13 + 0.05 * Math.sin(an.breathe * 1.3);
    c.fillStyle = glow;
    c.beginPath(); c.ellipse(px + 13, baseY + 22, 16, 23, 0, 0, 6.283); c.fill();
    c.globalAlpha = 1;
  }

  // Ein Bein zeichnen: Oberschenkel, Knie, Unterschenkel, Stiefel
  function drawLeg(f, hipX, shade, shadeHi) {
    const hipY = baseY + 25 + hipTilt * (hipX > 0 ? 1 : -1) * 0.5;
    const fx = cx + hipX + (side ? f.x * face : f.x * 0.35);
    const fy = footY + f.y;
    // Knie liegt zwischen Hüfte und Fuß, wird beim Anheben nach vorn gedrückt
    const kneeX = (cx + hipX) * 0.45 + fx * 0.55 + (side ? -f.y * 0.35 * face : 0);
    const kneeY = (hipY + fy) / 2 - Math.max(0, -f.y) * 0.3;
    c.strokeStyle = shade; c.lineWidth = 5; c.lineCap = 'butt';
    c.beginPath(); c.moveTo(R(cx + hipX), R(hipY)); c.lineTo(R(kneeX), R(kneeY)); c.stroke();
    c.strokeStyle = shadeHi; c.lineWidth = 4;
    c.beginPath(); c.moveTo(R(kneeX), R(kneeY)); c.lineTo(R(fx), R(fy - 2)); c.stroke();
    // Stiefel
    c.fillStyle = boot;
    c.fillRect(R(fx - 3), R(fy - 3), side ? 7 : 6, 4);
    if (side) c.fillRect(R(fx - 3 + (face > 0 ? 3 : -2)), R(fy - 2), 3, 3);
  }

  // Einen Arm zeichnen: Oberarm, Ellbogen, Unterarm, Hand
  function drawArm(swing, shX, sleeve, skinTone) {
    const shY = baseY + 18 + shoulderTilt * (shX > 0 ? 1 : -1) * 0.4;
    const handX = cx + shX + (side ? swing * face * 1.1 : swing * 0.5);
    const handY = shY + 12 - Math.abs(swing) * 0.25;
    const elbowX = (cx + shX) * 0.5 + handX * 0.5 + (side ? -swing * 0.25 * face : 0);
    const elbowY = shY + 6.5;
    c.strokeStyle = sleeve; c.lineWidth = 4;
    c.beginPath(); c.moveTo(R(cx + shX), R(shY)); c.lineTo(R(elbowX), R(elbowY)); c.stroke();
    c.strokeStyle = skinTone; c.lineWidth = 3;
    c.beginPath(); c.moveTo(R(elbowX), R(elbowY)); c.lineTo(R(handX), R(handY)); c.stroke();
    c.fillStyle = skinTone; c.fillRect(R(handX - 1.5), R(handY - 1), 3, 3);
  }

  const armSwing = -Math.sin(an.phase * Math.PI * 2) * 4.6 * sp;

  // ---- Hinteres Bein und hinterer Arm zuerst (verdeckt) ----
  if (side) {
    drawLeg(fB, -1, '#221f26', '#2e2a33');
    drawArm(-armSwing, -1, shirtDark, skinSh);
  } else {
    drawLeg(fB, 4, pants, pantsHi);
    drawArm(-armSwing, 7, shirtDark, skinSh);
  }

  // ---- Rumpf ----
  const bodyW = R(15 * sX), bodyH = R(12 * sY);
  const bodyX = R(cx - bodyW / 2 + shoulderTilt * 0.3), bodyY = R(baseY + 15);
  c.fillStyle = shirt; c.fillRect(bodyX, bodyY, bodyW, bodyH);
  // Schulterpartie heller
  c.fillStyle = shirtHi; c.fillRect(bodyX + 1, bodyY + 1, bodyW - 2, 5);
  // Seitenschatten
  c.fillStyle = shirtDark;
  c.fillRect(bodyX, bodyY, 2, bodyH);
  c.fillRect(bodyX + bodyW - 2, bodyY, 2, bodyH);
  // Gürtel, schmal und dunkel. Nur die Schnalle setzt einen Akzent.
  c.fillStyle = '#241c14'; c.fillRect(bodyX, bodyY + bodyH - 2, bodyW, 2);
  if (!back) { c.fillStyle = trim; c.fillRect(R(cx - 2), bodyY + bodyH - 2, 4, 2); }

  // Anhänger mit dem leuchtenden Kern (die Signatur)
  if (!back) {
    const pulse = 0.5 + 0.5 * Math.sin(an.breathe * 1.7);
    c.globalAlpha = pulse * 0.32; c.fillStyle = core;
    c.fillRect(R(cx - 3), bodyY + 3, 6, 6);
    c.globalAlpha = pulse; c.fillStyle = core;
    c.fillRect(R(cx - 1), bodyY + 5, 2, 3);
    c.globalAlpha = 1;
  }

  // ---- Vorderes Bein und vorderer Arm ----
  if (side) {
    drawLeg(fA, 1, pants, pantsHi);
    drawArm(armSwing, 1, shirt, skin);
  } else {
    drawLeg(fA, -4, pants, pantsHi);
    drawArm(armSwing, -7, shirt, skin);
  }

  // ---- Hals ----
  c.fillStyle = skinSh; c.fillRect(R(cx - 2), R(baseY + 13), 4, 3);

  // ---- Kopf ----
  // Der Kopf hängt der Bewegung minimal nach, das wirkt lebendig.
  const hx = R(cx - 6 + an.hoodX * 0.8 + an.facing * 1.2);
  const hy = R(baseY + 2 + bob * 0.3);
  // Gesicht
  c.fillStyle = skin; c.fillRect(hx + 1, hy + 3, 11, 10);
  c.fillStyle = skinHi; c.fillRect(hx + 2, hy + 4, 9, 3);
  c.fillStyle = skinSh; c.fillRect(hx + 1, hy + 11, 11, 2);
  // Ohren
  if (!back) {
    c.fillStyle = skinSh;
    if (side) { c.fillRect(R(hx + (face > 0 ? 3 : 8)), hy + 7, 2, 3); }
    else { c.fillRect(hx, hy + 7, 2, 3); c.fillRect(hx + 11, hy + 7, 2, 3); }
  }

  // Haar mit Federbewegung: es schwingt beim Laufen mit
  const hairSway = an.hoodX * 1.6;
  c.fillStyle = hair;
  c.fillRect(hx, hy, 13, 5);                               // Deckhaar
  c.fillRect(hx - 1, hy + 2, 3, 7);                        // Seite links
  c.fillRect(hx + 11, hy + 2, 3, 7);                       // Seite rechts
  c.fillStyle = hairHi; c.fillRect(hx + 2, hy + 1, 8, 2);  // Glanz
  // Hinterkopf-Schopf, folgt verzögert
  c.fillStyle = hair;
  if (side) c.fillRect(R(hx + (face > 0 ? -2 : 12) + hairSway * 0.5), hy + 3, 3, 6);
  else c.fillRect(R(hx + 3 + hairSway), hy - 1, 7, 3);

  if (back) {
    // Rückansicht: nur Hinterkopf, kein Gesicht
    c.fillStyle = hair; c.fillRect(hx + 1, hy + 3, 11, 8);
    c.fillStyle = hairHi; c.fillRect(hx + 3, hy + 4, 7, 2);
  } else if (an.blinking <= 0) {
    // Augen
    c.fillStyle = '#1a1008';
    if (side) {
      c.fillRect(R(hx + (face > 0 ? 8 : 3)), hy + 7, 2, 2);
    } else {
      c.fillRect(hx + 3, hy + 7, 2, 2);
      c.fillRect(hx + 8, hy + 7, 2, 2);
    }
    // Lichtpunkt in den Augen, in der Elementfarbe
    c.globalAlpha = 0.55; c.fillStyle = core;
    if (side) c.fillRect(R(hx + (face > 0 ? 8 : 3)), hy + 7, 1, 1);
    else { c.fillRect(hx + 3, hy + 7, 1, 1); c.fillRect(hx + 8, hy + 7, 1, 1); }
    c.globalAlpha = 1;
  } else {
    // Blinzeln
    c.fillStyle = skinSh;
    if (side) c.fillRect(R(hx + (face > 0 ? 8 : 3)), hy + 8, 2, 1);
    else { c.fillRect(hx + 3, hy + 8, 2, 1); c.fillRect(hx + 8, hy + 8, 2, 1); }
  }

  // Mund, nur in der Frontansicht angedeutet
  if (an.dir === 'down') { c.fillStyle = skinSh; c.fillRect(hx + 5, hy + 10, 3, 1); }
};

// NPC: menschlich, ruhigere Animation

G.drawNpc = (c, px, py, p, variant, t, seed) => {
  const R = Math.round;
  const ph = t * 1.1 + (seed || 0) * 2.3;
  const breath = Math.sin(ph) * 0.8;
  const shift = Math.sin(ph * 0.4) * 0.8;
  const skin = '#b0805a', skinSh = '#8a6244';
  const hairs = ['#2e2018', '#4a3524', '#1f1a16', '#5c4632'];
  const shirts = [p.textDim, p.dim, p.card, p.accent];
  const hair = hairs[variant % hairs.length];
  const shirt = shirts[variant % shirts.length];

  c.globalAlpha = 0.32; c.fillStyle = '#000';
  c.beginPath(); c.ellipse(px + 13, py + 41, 8, 3, 0, 0, 6.283); c.fill();
  c.globalAlpha = 1;

  const by = py + breath, cx = px + 13 + shift;
  // Beine
  c.strokeStyle = '#2a262f'; c.lineWidth = 5;
  c.beginPath(); c.moveTo(R(cx - 4), R(by + 27)); c.lineTo(R(cx - 4), R(by + 38)); c.stroke();
  c.beginPath(); c.moveTo(R(cx + 4), R(by + 27)); c.lineTo(R(cx + 4), R(by + 38)); c.stroke();
  c.fillStyle = '#17130f';
  c.fillRect(R(cx - 7), R(by + 37), 6, 4); c.fillRect(R(cx + 1), R(by + 37), 6, 4);
  // Arme
  c.strokeStyle = shirt; c.lineWidth = 4;
  c.beginPath(); c.moveTo(R(cx - 7), R(by + 17)); c.lineTo(R(cx - 8), R(by + 27)); c.stroke();
  c.beginPath(); c.moveTo(R(cx + 7), R(by + 17)); c.lineTo(R(cx + 8), R(by + 27)); c.stroke();
  c.fillStyle = skin;
  c.fillRect(R(cx - 9), R(by + 26), 3, 3); c.fillRect(R(cx + 7), R(by + 26), 3, 3);
  // Rumpf
  c.fillStyle = shirt; c.fillRect(R(cx - 7), R(by + 15), 14, 14);
  c.fillStyle = p.cardLight; c.fillRect(R(cx - 6), R(by + 16), 12, 4);
  // Kopf
  const hx = R(cx - 6), hy = R(by + 3);
  c.fillStyle = skinSh; c.fillRect(R(cx - 2), R(by + 13), 4, 3);
  c.fillStyle = skin; c.fillRect(hx + 1, hy + 3, 11, 10);
  c.fillStyle = hair;
  c.fillRect(hx, hy, 13, 5); c.fillRect(hx - 1, hy + 2, 3, 7); c.fillRect(hx + 11, hy + 2, 3, 7);
  c.fillStyle = '#1a1008'; c.fillRect(hx + 3, hy + 7, 2, 2); c.fillRect(hx + 8, hy + 7, 2, 2);

  // Variante 0 starrt auf einen Bildschirm
  if (variant === 0) {
    const f = 0.4 + 0.35 * Math.sin(t * 9 + (seed || 0));
    c.globalAlpha = f; c.fillStyle = '#8fa8c8';
    c.fillRect(R(cx - 5), R(by + 20), 10, 7);
    c.globalAlpha = f * 0.35; c.fillRect(hx, hy + 2, 13, 10);
    c.globalAlpha = 1;
  }
};

G.drawSpirit = (c, px, py, p, t, color, trail) => {
  if (trail) {
    for (let i = trail.length - 1; i >= 0; i--) {
      c.globalAlpha = (i / trail.length) * 0.26;
      c.fillStyle = color;
      c.fillRect(Math.round(trail[i].x), Math.round(trail[i].y), 4, 4);
    }
  }
  const x = px + Math.sin(t * 1.9) * 4, y = py + Math.cos(t * 2.6) * 4.6;
  const pulse = 0.7 + 0.3 * Math.sin(t * 4);
  c.globalAlpha = 0.15 * pulse; c.fillStyle = color;
  c.beginPath(); c.arc(x + 4, y + 4, 13, 0, 6.283); c.fill();
  c.globalAlpha = 0.42 * pulse;
  c.beginPath(); c.arc(x + 4, y + 4, 7, 0, 6.283); c.fill();
  c.globalAlpha = 1;
  c.fillRect(Math.round(x + 1), Math.round(y + 1), 6, 6);
  c.globalAlpha = 0.85; c.fillStyle = '#fff';
  c.fillRect(Math.round(x + 3), Math.round(y + 3), 2, 2);
  c.globalAlpha = 1;
};

G.drawFragment = (c, px, py, p, t, seed) => {

  const a = 0.55 + 0.45 * Math.sin(t * 3 + (seed || 0) * 2);
  c.globalAlpha = a * 0.16; c.fillStyle = p.bright;
  c.beginPath(); c.arc(x, y, 20, 0, 6.283); c.fill();
  c.globalAlpha = a * 0.35;
  c.beginPath(); c.arc(x, y, 11, 0, 6.283); c.fill();
  c.globalAlpha = 1;
  const r = t * 1.4 + (seed || 0);
  c.save(); c.translate(x, y); c.rotate(r);
  c.fillStyle = p.bright; c.fillRect(-3, -11, 6, 22); c.fillRect(-11, -3, 22, 6);
  c.fillStyle = p.textBright; c.fillRect(-3, -3, 6, 6);
  c.restore();
};

// ------------------------------------------------------------
// LICHT: Fackeln, Kristalle und Leylinien werfen echtes Licht
// ------------------------------------------------------------
// Wird als weiches Overlay über den Raum gelegt. Die Lichtquellen
// stammen aus den Kacheln selbst, deshalb passt es immer zum Raum.
const LIGHT_TILES = { f: [46, 1.0], c: [40, 0.75], '*': [30, 0.55], M: [26, 0.5], D: [24, 0.4], p: [20, 0.35] };

G.drawLight = (c, room, p, t) => {
  const tiles = G.roomTiles(room);
  const src = [];
  for (let ty = 0; ty < G.ROOM_H; ty++) {
    const row = tiles[ty] || '';
    for (let tx = 0; tx < G.ROOM_W; tx++) {
      const L = LIGHT_TILES[row[tx]];
      if (L) src.push([tx * T + T / 2, ty * T + T / 2, L[0], L[1], noise2(tx, ty)]);
    }
  }
  if (!src.length) return;
  c.save();
  c.globalCompositeOperation = 'lighter';
  for (const [x, y, r, i0, n] of src) {
    const flick = i0 * (0.82 + 0.18 * Math.sin(t * 6 + n * 9));
    const g = c.createRadialGradient(x, y, 0, x, y, r);
    const col = p.glow;
    g.addColorStop(0, col);
    g.addColorStop(1, 'rgba(0,0,0,0)');
    c.globalAlpha = 0.16 * flick;
    c.fillStyle = g;
    c.fillRect(x - r, y - r, r * 2, r * 2);
  }
  c.restore();
  c.globalAlpha = 1;
};

// FAUNA: kleine Lebewesen je Habitat, rein dekorativ
// ------------------------------------------------------------
G.newFauna = (biome, seed) => {
  const rng = G.mulberry32(seed >>> 0);
  const kinds = {
    sumpf: { n: 5, art: 'fisch' }, mond: { n: 7, art: 'falter' },
    hain: { n: 8, art: 'gluehwurm' }, kristall: { n: 4, art: 'splitter' },
    unterwelt: { n: 5, art: 'funke' }, wueste: { n: 3, art: 'kaefer' },
    sternen: { n: 6, art: 'stern' }, bibliothek: { n: 4, art: 'blatt' },
    asche: { n: 4, art: 'krahe' },
  };
  const k = kinds[biome] || kinds.asche;
  const out = [];
  for (let i = 0; i < k.n; i++) {
    out.push({
      art: k.art,
      x: rng() * G.W, y: rng() * G.FIELD_H,
      vx: (rng() - 0.5) * 22, vy: (rng() - 0.5) * 18,
      ph: rng() * 6.28, sp: 0.6 + rng() * 0.9,
    });
  }
  return out;
};

G.updateFauna = (fa, dt, t, px, py) => {
  for (const f of fa) {
    if (f.art === 'gluehwurm' || f.art === 'falter' || f.art === 'funke') {
      // Schweben mit Eigenleben, weichen dem Spieler leicht aus
      f.x += (f.vx + Math.sin(t * f.sp + f.ph) * 12) * dt;
      f.y += (f.vy + Math.cos(t * f.sp * 1.3 + f.ph) * 10) * dt;
      const dx = f.x - px, dy = f.y - py, d = Math.hypot(dx, dy);
      if (d < 46 && d > 0.1) { f.x += (dx / d) * 26 * dt; f.y += (dy / d) * 26 * dt; }
    } else if (f.art === 'fisch') {
      f.x += f.vx * dt; f.y += Math.sin(t * 1.4 + f.ph) * 10 * dt;
    } else if (f.art === 'krahe' || f.art === 'blatt') {
      f.x += f.vx * dt * 1.4; f.y += (f.vy * 0.4 + Math.sin(t * 2 + f.ph) * 14) * dt;
    } else {
      f.x += f.vx * dt * 0.6; f.y += f.vy * dt * 0.6;
    }
    // Am Rand umkehren statt verschwinden
    if (f.x < 6) { f.x = 6; f.vx = Math.abs(f.vx); }
    if (f.x > G.W - 6) { f.x = G.W - 6; f.vx = -Math.abs(f.vx); }
    if (f.y < 6) { f.y = 6; f.vy = Math.abs(f.vy); }
    if (f.y > G.FIELD_H - 6) { f.y = G.FIELD_H - 6; f.vy = -Math.abs(f.vy); }
  }
};

G.drawFauna = (c, fa, p, t) => {
  for (const f of fa) {
    const x = Math.round(f.x), y = Math.round(f.y);
    const puls = 0.5 + 0.5 * Math.sin(t * 3 + f.ph);
    if (f.art === 'gluehwurm' || f.art === 'funke') {
      c.globalAlpha = 0.2 * puls; c.fillStyle = p.glow;
      c.beginPath(); c.arc(x, y, 6, 0, 6.283); c.fill();
      c.globalAlpha = 0.7 + 0.3 * puls; c.fillStyle = p.bright;
      c.fillRect(x - 1, y - 1, 2, 2);
    } else if (f.art === 'falter') {
      const w = Math.sin(t * 12 + f.ph) * 3;
      c.globalAlpha = 0.75; c.fillStyle = p.textBright;
      c.fillRect(x - 1, y - 1, 2, 3);
      c.fillStyle = p.text;
      c.fillRect(x - 1 - Math.abs(w), y - 1, Math.abs(w), 2);
      c.fillRect(x + 1, y - 1, Math.abs(w), 2);
    } else if (f.art === 'fisch') {
      c.globalAlpha = 0.4; c.fillStyle = p.main;
      const dir = f.vx > 0 ? 1 : -1;
      c.fillRect(x, y, 5, 2);
      c.fillRect(x - dir * 2, y - 1, 2, 4);
    } else if (f.art === 'krahe') {
      c.globalAlpha = 0.55; c.fillStyle = p.bgVoid;
      const flap = Math.sin(t * 8 + f.ph) * 2;
      c.fillRect(x - 4, y - flap, 4, 1);
      c.fillRect(x + 1, y + flap, 4, 1);
      c.fillRect(x - 1, y, 2, 2);
    } else if (f.art === 'blatt') {
      c.globalAlpha = 0.5; c.fillStyle = p.dim;
      c.save(); c.translate(x, y); c.rotate(t * 1.6 + f.ph);
      c.fillRect(-3, -1, 6, 2); c.restore();
    } else if (f.art === 'stern') {
      c.globalAlpha = 0.3 + 0.6 * puls; c.fillStyle = p.bright;
      c.fillRect(x, y, 2, 2);
      if (puls > 0.85) { c.fillRect(x - 2, y, 6, 1); c.fillRect(x, y - 2, 1, 6); }
    } else if (f.art === 'splitter') {
      c.globalAlpha = 0.35 + 0.4 * puls; c.fillStyle = p.glow;
      c.save(); c.translate(x, y); c.rotate(t + f.ph);
      c.fillRect(-2, -2, 4, 4); c.restore();
    } else {
      c.globalAlpha = 0.5; c.fillStyle = p.dim;
      c.fillRect(x, y, 3, 2);
    }
  }
  c.globalAlpha = 1;
};

// ------------------------------------------------------------
// Inschrift: ein lesbarer Stein, trägt die Story
// ------------------------------------------------------------
G.drawInschrift = (c, px, py, p, t, gelesen) => {
  const x = Math.round(px), y = Math.round(py);
  c.globalAlpha = 0.3; c.fillStyle = '#000';
  c.beginPath(); c.ellipse(x + 20, y + 33, 10, 3, 0, 0, 6.283); c.fill();
  c.globalAlpha = 1;
  // Stele
  c.fillStyle = p.bgDeep; c.fillRect(x + 11, y + 8, 18, 25);
  c.fillStyle = p.card; c.fillRect(x + 12, y + 9, 15, 23);
  c.fillStyle = p.cardLight; c.fillRect(x + 13, y + 10, 4, 21);
  c.fillStyle = p.cardHi; c.fillRect(x + 12, y + 8, 15, 2);
  // Eingeritzte Zeilen
  c.fillStyle = p.bgVoid;
  c.fillRect(x + 15, y + 14, 9, 1); c.fillRect(x + 15, y + 18, 7, 1);
  c.fillRect(x + 15, y + 22, 10, 1); c.fillRect(x + 15, y + 26, 6, 1);
  if (!gelesen) {
    const a = 0.35 + 0.35 * Math.sin(t * 2.2);
    c.globalAlpha = a * 0.5; c.fillStyle = p.main;
    c.beginPath(); c.arc(x + 20, y + 20, 17, 0, 6.283); c.fill();
    c.globalAlpha = a; c.fillStyle = p.bright;
    c.fillRect(x + 18, y + 3, 4, 4);
    c.globalAlpha = 1;
  }
};

// ------------------------------------------------------------
// Raum zeichnen
// ------------------------------------------------------------
G.roomTiles = (r) => (r && r.tiles) ? r.tiles : r;
G.roomPal = (r) => (r && r.biome && G.BIOMES[r.biome]) ? G.BIOMES[r.biome] : null;

G.drawRoom = (c, room, p, t) => {
  const tiles = G.roomTiles(room);
  p = G.roomPal(room) || p;
  for (let ty = 0; ty < G.ROOM_H; ty++) {
    const row = tiles[ty] || '';
    for (let tx = 0; tx < G.ROOM_W; tx++) {
      const ch = row[tx] || '.';
      (G.TILES[ch] || G.TILES['.']).draw(c, tx * T, ty * T, p, t, tx, ty);
    }
  }
};

G.isSolid = (room, px, py) => {
  const tiles = G.roomTiles(room);
  const tx = Math.floor(px / T), ty = Math.floor(py / T);
  if (tx < 0 || tx >= G.ROOM_W || ty < 0 || ty >= G.ROOM_H) return false;
  const ch = (tiles[ty] || '')[tx] || '.';
  const tile = G.TILES[ch];
  return tile ? tile.solid : false;
};
