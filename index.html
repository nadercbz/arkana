<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#0a0602">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="ARKANA">
<meta name="description" content="ARKANA — ein mystisches Retro-Adventure. Finde dein verborgenes Muster.">
<title>ARKANA — Das verborgene Muster</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body {
  width: 100%; height: 100%; overflow: hidden;
  background: #050301; touch-action: none;
  font-family: 'Courier New', ui-monospace, monospace;
  overscroll-behavior: none;
  -webkit-user-select: none; user-select: none;
}
#wrap { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; }
#game {
  image-rendering: pixelated; image-rendering: crisp-edges;
  background: #050301; display: block;
}
#scanlines { position: absolute; pointer-events: none; mix-blend-mode: multiply; opacity: 0.75; }

/* Touch-Steuerung liegt als Overlay über dem Bild, kostet also keine Fläche */
#touchzone { position: fixed; inset: 0; z-index: 5; display: none; }
body.touch #touchzone { display: block; }

#stick {
  position: fixed; width: 120px; height: 120px; z-index: 6; display: none;
  pointer-events: none; border: 2px solid rgba(255,140,0,0.30); border-radius: 50%;
  background: radial-gradient(circle, rgba(255,140,0,0.10), rgba(255,140,0,0.02));
}
#stick-knob {
  position: absolute; left: 38px; top: 38px; width: 44px; height: 44px;
  border-radius: 50%; background: rgba(255,140,0,0.42);
  border: 2px solid rgba(255,180,71,0.75);
}
#pad { position: fixed; inset: 0; pointer-events: none; display: none; z-index: 7; }
body.touch #pad { display: block; }
.pbtn {
  position: absolute; pointer-events: auto;
  border: 2px solid rgba(255,140,0,0.45); border-radius: 50%;
  background: rgba(255,140,0,0.12); color: rgba(255,232,194,0.9);
  display: flex; align-items: center; justify-content: center;
  font-family: 'Courier New', monospace; font-weight: bold;
  transition: background 0.08s, transform 0.08s;
}
.pbtn:active, .pbtn.on { background: rgba(255,140,0,0.42); transform: scale(0.93); }
#p-a { right: 22px; bottom: calc(84px + env(safe-area-inset-bottom, 0px)); width: 88px; height: 88px; font-size: 19px; }
#p-b { right: 34px; bottom: calc(14px + env(safe-area-inset-bottom, 0px)); width: 62px; height: 62px; font-size: 13px; }
/* Steuerkreuz nur am Rechner sichtbar, am Handy übernimmt der Stick */
#p-up, #p-down, #p-left, #p-right { display: none; }

#nameform {
  position: fixed; inset: 0; z-index: 20; display: none;
  align-items: center; justify-content: center; flex-direction: column;
  background: rgba(4,2,0,0.95); padding: 20px;
}
#nameform.show { display: flex; }
#nameform label { color: #ff8c00; font-size: 16px; letter-spacing: 3px; margin-bottom: 20px; text-align: center; line-height: 1.7; }
#nameform input {
  background: #1a0d05; border: 2px solid #cc6600; color: #ffe8c2;
  font-family: 'Courier New', monospace; font-size: 24px; text-align: center;
  padding: 14px; width: min(80vw, 320px); outline: none; border-radius: 4px;
}
#nameform input:focus { border-color: #ff8c00; box-shadow: 0 0 14px rgba(255,140,0,0.35); }
#nameform button {
  margin-top: 22px; background: #ff8c00; border: none; color: #1a0d05;
  font-family: 'Courier New', monospace; font-size: 17px; font-weight: bold;
  padding: 14px 40px; border-radius: 4px; letter-spacing: 3px;
}
</style>
</head>
<body>
<div id="wrap">
  <canvas id="game" width="360" height="640"></canvas>
  <div id="scanlines"></div>
</div>
<div id="touchzone"></div>
<div id="stick"><div id="stick-knob"></div></div>
<div id="pad">
  <div class="pbtn" id="p-up">▲</div>
  <div class="pbtn" id="p-down">▼</div>
  <div class="pbtn" id="p-left">◀</div>
  <div class="pbtn" id="p-right">▶</div>
  <div class="pbtn" id="p-a">OK</div>
  <div class="pbtn" id="p-b">MENÜ</div>
</div>
<div id="nameform">
  <label id="nameform-label">WIE LAUTET DEIN NAME?</label>
  <input id="nameform-input" maxlength="16" autocomplete="off" autocapitalize="words" spellcheck="false">
  <button id="nameform-ok">WEITER</button>
</div>
<script>
// ===== 01_core.js =====
'use strict';
// ============================================================
// ARKANA Core: 9:16 Hochformat, DPR-scharfes Rendering,
// Input, Engine, Partikel, Text
// ============================================================
const G = {};

// --- Auflösung ---
// Breite fest 360. Spielfeld immer 15x22 Tiles à 24px, damit alle
// Spieler exakt gleich viel sehen. Die Höhe wächst mit dem Gerät:
// auf langen Handys (19.5:9) wird der HUD-Bereich größer, statt
// schwarze Balken zu lassen. Basis bleibt 9:16.
G.W = 360;
G.H_BASE = 640;          // 9:16 Referenz
G.H = G.H_BASE;
G.TILE = 24;
G.ROOM_W = 15; G.ROOM_H = 22;
G.FIELD_H = G.ROOM_H * G.TILE; // 528
G.HUD_Y = G.FIELD_H;
G.HUD_H = G.H - G.FIELD_H;
G.SAFE_Y = 0;            // Offset, um Vollbild-Menüs vertikal zu zentrieren

// --- Paletten ---
G.PAL = {
  amber: {
    bg: '#1a0d05', bgDeep: '#0d0602', bgVoid: '#050301',
    card: '#2d1b0e', cardLight: '#3d2817', cardHi: '#4d3420',
    main: '#ff8c00', bright: '#ffa500', glow: '#ffb347', dim: '#cc6600',
    text: '#ffd580', textBright: '#ffe8c2', textDim: '#ad6e21',
    accent: '#7ec97e', danger: '#d96a6a',
  },
  gray: {
    bg: '#15161a', bgDeep: '#0b0c0e', bgVoid: '#050506',
    card: '#22242a', cardLight: '#2e3138', cardHi: '#3a3e46',
    main: '#8b8f99', bright: '#a8adb8', glow: '#c0c5d0', dim: '#565a63',
    text: '#9aa0ac', textBright: '#c7ccd6', textDim: '#5c616b',
    accent: '#7a86a0', danger: '#8a6a6a',
  },
};
G.pal = G.PAL.gray;

// Element-Färbung des Spielers, kommt aus dem Sternzeichen
G.ELEMENT_COLORS = {
  Feuer: { robe: '#c4502a', robeHi: '#e8703f', robeDark: '#6b2a16', trim: '#ffb347', core: '#ff8c00' },
  Wasser: { robe: '#2a5f7a', robeHi: '#3f86a8', robeDark: '#163544', trim: '#9fd8e8', core: '#7ec8e8' },
  Erde: { robe: '#4a5a2a', robeHi: '#6b803f', robeDark: '#283016', trim: '#c4d88a', core: '#a8c060' },
  Luft: { robe: '#5a4a7a', robeHi: '#7f6ba8', robeDark: '#312844', trim: '#d8c8f0', core: '#b89ee8' },
};

// --- Einstellungen ---
G.settings = { crt: true, partikel: true };

// --- Canvas, DPR-bewusst ---
G.canvas = document.getElementById('game');
G.ctx = G.canvas.getContext('2d', { alpha: false });
G.ctx.imageSmoothingEnabled = false;

function fitCanvas() {
  const vw = window.innerWidth, vh = window.innerHeight;

  // Interne Höhe an das Geräteverhältnis anpassen, damit der Bildschirm
  // ohne Balken gefüllt wird. Das Spielfeld bleibt konstant, nur das
  // HUD wächst. Begrenzt, damit das Layout nicht auseinanderfällt.
  const wanted = Math.round(G.W * (vh / vw) / 2) * 2;
  G.H = Math.max(G.H_BASE, Math.min(wanted, 860));
  G.HUD_H = G.H - G.FIELD_H;
  G.SAFE_Y = Math.round((G.H - G.H_BASE) / 2);

  const scale = Math.min(vw / G.W, vh / G.H);
  const cssW = Math.round(G.W * scale), cssH = Math.round(G.H * scale);
  G.canvas.style.width = cssW + 'px';
  G.canvas.style.height = cssH + 'px';

  // Backing-Store an das physische Pixelraster koppeln: scharfe Kanten
  // auch auf Retina, ohne dass der Browser weichzeichnet.
  const dpr = Math.min(window.devicePixelRatio || 1, 3);
  const bw = Math.round(cssW * dpr), bh = Math.round(cssH * dpr);
  if (G.canvas.width !== bw || G.canvas.height !== bh) {
    G.canvas.width = bw; G.canvas.height = bh;
  }
  G.renderScale = bw / G.W;
  G.ctx.imageSmoothingEnabled = false;

  const sl = document.getElementById('scanlines');
  const r = G.canvas.getBoundingClientRect();
  sl.style.left = r.left + 'px'; sl.style.top = r.top + 'px';
  sl.style.width = cssW + 'px'; sl.style.height = cssH + 'px';
  sl.style.display = G.settings.crt ? 'block' : 'none';
  // Scanline-Dichte an die Skalierung koppeln, sonst moiriert es
  const period = Math.max(2, Math.round(scale * 2));
  sl.style.backgroundImage = `repeating-linear-gradient(0deg, rgba(0,0,0,0.20) 0px, rgba(0,0,0,0.20) ${period / 2}px, transparent ${period / 2}px, transparent ${period}px)`;
}
window.addEventListener('resize', () => fitCanvas());
window.addEventListener('orientationchange', () => setTimeout(fitCanvas, 100));

// --- Input: Tastatur, Touch-Pad, Wischen ---
G.input = (() => {
  const held = {}; const pressed = {};
  // Analoger Richtungsvektor, damit die Figur weich beschleunigt
  const vec = { x: 0, y: 0 };
  const map = {
    ArrowUp: 'up', ArrowDown: 'down', ArrowLeft: 'left', ArrowRight: 'right',
    w: 'up', s: 'down', a: 'left', d: 'right', W: 'up', S: 'down', A: 'left', D: 'right',
    Enter: 'action', ' ': 'action', e: 'action', E: 'action',
    Escape: 'cancel', q: 'cancel', Q: 'cancel',
  };
  window.addEventListener('keydown', (e) => {
    const k = map[e.key];
    if (!k) return;
    e.preventDefault();
    if (!held[k]) pressed[k] = true;
    held[k] = true;
  });
  window.addEventListener('keyup', (e) => { const k = map[e.key]; if (k) held[k] = false; });

  function bindBtn(id, key) {
    const el = document.getElementById(id);
    if (!el) return;
    const on = (e) => { e.preventDefault(); if (!held[key]) pressed[key] = true; held[key] = true; el.classList.add('on'); };
    const off = (e) => { e.preventDefault(); held[key] = false; el.classList.remove('on'); };
    el.addEventListener('touchstart', on, { passive: false });
    el.addEventListener('touchend', off, { passive: false });
    el.addEventListener('touchcancel', off, { passive: false });
    el.addEventListener('mousedown', on);
    el.addEventListener('mouseup', off);
    el.addEventListener('mouseleave', off);
  }
  if ('ontouchstart' in window || navigator.maxTouchPoints > 0) document.body.classList.add('touch');
  ['up', 'down', 'left', 'right'].forEach((d) => bindBtn('p-' + d, d));
  bindBtn('p-a', 'action'); bindBtn('p-b', 'cancel');

  // Virtueller Stick: Daumen irgendwo auf der linken Bildhälfte aufsetzen
  const stick = { active: false, id: null, cx: 0, cy: 0, dx: 0, dy: 0 };
  const stickEl = document.getElementById('stick');
  const knobEl = document.getElementById('stick-knob');
  function stickStart(e) {
    for (const t of e.changedTouches) {
      if (t.clientX > window.innerWidth * 0.55) continue; // rechte Hälfte = Aktionen
      stick.active = true; stick.id = t.identifier;
      stick.cx = t.clientX; stick.cy = t.clientY;
      stickEl.style.display = 'block';
      stickEl.style.left = (stick.cx - 60) + 'px';
      stickEl.style.top = (stick.cy - 60) + 'px';
      knobEl.style.transform = 'translate(0px,0px)';
      e.preventDefault();
      break;
    }
  }
  function stickMove(e) {
    if (!stick.active) return;
    for (const t of e.changedTouches) {
      if (t.identifier !== stick.id) continue;
      let dx = t.clientX - stick.cx, dy = t.clientY - stick.cy;
      const len = Math.hypot(dx, dy), max = 46;
      if (len > max) { dx = dx / len * max; dy = dy / len * max; }
      stick.dx = dx / max; stick.dy = dy / max;
      knobEl.style.transform = `translate(${dx}px,${dy}px)`;
      e.preventDefault();
      break;
    }
  }
  function stickEnd(e) {
    for (const t of e.changedTouches) {
      if (t.identifier !== stick.id) continue;
      stick.active = false; stick.dx = 0; stick.dy = 0;
      stickEl.style.display = 'none';
      break;
    }
  }
  const zone = document.getElementById('touchzone');
  if (zone) {
    zone.addEventListener('touchstart', stickStart, { passive: false });
    zone.addEventListener('touchmove', stickMove, { passive: false });
    zone.addEventListener('touchend', stickEnd, { passive: false });
    zone.addEventListener('touchcancel', stickEnd, { passive: false });
  }

  return {
    held: (k) => !!held[k],
    pressed: (k) => !!pressed[k],
    // Richtungsvektor aus Stick oder Tasten, normalisiert
    dir() {
      if (stick.active && (Math.abs(stick.dx) > 0.15 || Math.abs(stick.dy) > 0.15)) {
        return { x: stick.dx, y: stick.dy };
      }
      let x = 0, y = 0;
      if (held.left) x -= 1; if (held.right) x += 1;
      if (held.up) y -= 1; if (held.down) y += 1;
      const l = Math.hypot(x, y);
      if (l > 1) { x /= l; y /= l; }
      return { x, y };
    },
    endFrame: () => { for (const k in pressed) delete pressed[k]; },
    clearAll: () => { for (const k in held) held[k] = false; for (const k in pressed) delete pressed[k]; stick.active = false; stick.dx = 0; stick.dy = 0; if (stickEl) stickEl.style.display = 'none'; },
  };
})();

// --- Szenen-Stack ---
G.scenes = [];
G.pushScene = (s) => { G.scenes.push(s); if (s.enter) s.enter(); };
G.popScene = () => { const s = G.scenes.pop(); if (s && s.exit) s.exit(); };
G.replaceScene = (s) => { while (G.scenes.length) G.popScene(); G.pushScene(s); };
G.topScene = () => G.scenes[G.scenes.length - 1];

// --- Partikel-System (Asche, Funken, Staub) ---
G.particles = [];
G.spawnParticle = (p) => { if (G.settings.partikel && G.particles.length < 220) G.particles.push(p); };
G.updateParticles = (dt) => {
  for (let i = G.particles.length - 1; i >= 0; i--) {
    const p = G.particles[i];
    p.life -= dt;
    if (p.life <= 0) { G.particles.splice(i, 1); continue; }
    p.x += p.vx * dt; p.y += p.vy * dt;
    if (p.drift) p.x += Math.sin(p.life * p.drift) * 6 * dt;
    if (p.grav) p.vy += p.grav * dt;
  }
};
G.drawParticles = (c) => {
  for (const p of G.particles) {
    const a = Math.min(1, p.life / (p.fade || 1));
    c.globalAlpha = a * (p.alpha || 1);
    c.fillStyle = p.color;
    const s = p.size || 2;
    c.fillRect(Math.round(p.x), Math.round(p.y), s, s);
  }
  c.globalAlpha = 1;
};

// --- Bildschirm-Erschütterung ---
G.shake = { t: 0, mag: 0 };
G.doShake = (mag, dur) => { G.shake.mag = mag; G.shake.t = dur; };

// --- Game Loop (fester Timestep, rAF plus Fallback) ---
(() => {
  let last = performance.now(); let acc = 0; let lastTick = 0;
  const STEP = 1000 / 60;
  function tick() {
    const now = performance.now();
    lastTick = now;
    acc += Math.min(now - last, 100); last = now;
    let steps = 0;
    while (acc >= STEP && steps < 5) {
      const s = G.topScene();
      if (s) s.update(STEP / 1000);
      G.updateParticles(STEP / 1000);
      if (G.shake.t > 0) G.shake.t -= STEP / 1000;
      G.input.endFrame();
      acc -= STEP; steps++;
    }
    if (acc > STEP * 5) acc = 0;

    const ctx = G.ctx;
    ctx.save();
    ctx.scale(G.renderScale || 1, G.renderScale || 1);
    ctx.fillStyle = G.pal.bgVoid;
    ctx.fillRect(0, 0, G.W, G.H);
    if (G.shake.t > 0) {
      const m = G.shake.mag * (G.shake.t);
      ctx.translate(Math.round((Math.random() - 0.5) * m), Math.round((Math.random() - 0.5) * m));
    }
    const s = G.topScene();
    if (s) {
      if (s.translucent && G.scenes.length > 1) G.scenes[G.scenes.length - 2].draw(ctx);
      s.draw(ctx);
    }
    ctx.restore();
  }
  function frame() { tick(); requestAnimationFrame(frame); }
  requestAnimationFrame(frame);
  setInterval(() => { if (performance.now() - lastTick > 50) tick(); }, 33);
  G._tick = tick;
})();

// --- Text ---
G.FONT = "'Courier New', ui-monospace, monospace";
G.text = (ctx, str, x, y, color, size = 14, align = 'left', weight = '') => {
  ctx.font = `${weight} ${size}px ${G.FONT}`.trim();
  ctx.textAlign = align; ctx.textBaseline = 'top';
  ctx.fillStyle = color;
  ctx.fillText(str, x, y);
};
G.textGlow = (ctx, str, x, y, color, size = 14, align = 'center') => {
  ctx.save();
  ctx.shadowColor = color; ctx.shadowBlur = 8;
  G.text(ctx, str, x, y, color, size, align, 'bold');
  ctx.restore();
};
G.wrapText = (ctx, str, maxWidth, size = 14) => {
  ctx.font = `${size}px ${G.FONT}`;
  const words = str.split(' '); const lines = []; let line = '';
  for (const w of words) {
    const test = line ? line + ' ' + w : w;
    if (ctx.measureText(test).width > maxWidth && line) { lines.push(line); line = w; }
    else line = test;
  }
  if (line) lines.push(line);
  return lines;
};

// --- Vignette ---
G.vignette = (c, strength = 0.55) => {
  const g = c.createRadialGradient(G.W / 2, G.FIELD_H / 2, G.W * 0.28, G.W / 2, G.FIELD_H / 2, G.W * 0.85);
  g.addColorStop(0, 'rgba(0,0,0,0)');
  g.addColorStop(1, `rgba(0,0,0,${strength})`);
  c.fillStyle = g;
  c.fillRect(0, 0, G.W, G.FIELD_H);
};

// --- Zufall mit Seed ---
G.mulberry32 = (seed) => {
  let a = seed >>> 0;
  return () => {
    a |= 0; a = (a + 0x6D2B79F5) | 0;
    let t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
};
G.hashStr = (s) => {
  let h = 2166136261;
  for (let i = 0; i < s.length; i++) { h ^= s.charCodeAt(i); h = Math.imul(h, 16777619); }
  return h >>> 0;
};

// --- Spielstand ---
G.state = null;
G.save = () => { try { localStorage.setItem('arkana_save', JSON.stringify(G.state)); } catch (e) { /* ignoriert */ } };
G.load = () => { try { const r = localStorage.getItem('arkana_save'); return r ? JSON.parse(r) : null; } catch (e) { return null; } };
G.clearSave = () => { try { localStorage.removeItem('arkana_save'); } catch (e) { /* ignoriert */ } };

// ===== 02_world.js =====
'use strict';
// ============================================================
// ARKANA World: 24px Tiles, organische Charakter-Animation
// ============================================================

const T = 24; // Tile-Größe

// ------------------------------------------------------------
// TILES. Prozedural gezeichnet, mehrere Schattierungen pro Tile.
// ------------------------------------------------------------
function noise2(x, y) { // deterministisches Pseudo-Rauschen pro Tile
  let h = (x * 374761393 + y * 668265263) >>> 0;
  h = (h ^ (h >>> 13)) >>> 0; h = Math.imul(h, 1274126177) >>> 0;
  return ((h ^ (h >>> 16)) >>> 0) / 4294967296;
}

G.TILES = {
  // Leerer Grund
  '.': { solid: false, draw: (c, x, y, p, t, tx, ty) => {
    c.fillStyle = p.bg; c.fillRect(x, y, T, T);
    const n = noise2(tx, ty);
    if (n > 0.72) { c.fillStyle = p.bgDeep; c.fillRect(x + Math.floor(n * 18), y + Math.floor((n * 37) % 20), 2, 1); }
    if (n < 0.12) { c.fillStyle = p.card; c.fillRect(x + 5, y + 14, 3, 1); }
  } },
  // Boden mit Struktur
  ',': { solid: false, draw: (c, x, y, p, t, tx, ty) => {
    c.fillStyle = p.bg; c.fillRect(x, y, T, T);
    const n = noise2(tx, ty);
    c.fillStyle = p.bgDeep;
    c.fillRect(x + 3 + Math.floor(n * 10), y + 5, 3, 1);
    c.fillRect(x + 14, y + 12 + Math.floor(n * 6), 2, 1);
    c.fillRect(x + 8, y + 19, 4, 1);
  } },
  // Mauer, mit Fugen und Kantenlicht
  '#': { solid: true, draw: (c, x, y, p, t, tx, ty) => {
    const n = noise2(tx, ty);
    c.fillStyle = p.card; c.fillRect(x, y, T, T);
    c.fillStyle = p.cardLight; c.fillRect(x, y, T, 3);
    c.fillStyle = p.cardHi; c.fillRect(x, y, T, 1);
    c.fillStyle = p.bgDeep; c.fillRect(x, y + T - 3, T, 3);
    // Steinfugen, versetzt je Reihe
    c.fillStyle = p.bgDeep;
    const off = (ty % 2) * 12;
    c.fillRect(x + ((off + 11) % T), y + 3, 1, 9);
    c.fillRect(x, y + 11, T, 1);
    c.fillRect(x + ((off + 5) % T), y + 12, 1, 9);
    if (n > 0.8) { c.fillStyle = p.cardHi; c.fillRect(x + 4, y + 15, 3, 2); }
  } },
  // Fenster / toter Bildschirm
  'W': { solid: true, draw: (c, x, y, p, t, tx, ty) => {
    c.fillStyle = p.card; c.fillRect(x, y, T, T);
    c.fillStyle = p.cardLight; c.fillRect(x, y, T, 2);
    c.fillStyle = p.bgVoid; c.fillRect(x + 4, y + 4, 16, 13);
    const flick = 0.25 + 0.2 * Math.sin(t * 3 + noise2(tx, ty) * 9);
    c.globalAlpha = flick; c.fillStyle = p.glow; c.fillRect(x + 5, y + 5, 14, 5); c.globalAlpha = 1;
    c.fillStyle = p.dim; c.fillRect(x + 4, y + 17, 16, 1);
  } },
  // Nebel / Wasser, animiert
  '~': { solid: true, draw: (c, x, y, p, t, tx, ty) => {
    c.fillStyle = p.bgDeep; c.fillRect(x, y, T, T);
    const n = noise2(tx, ty) * 6;
    c.fillStyle = p.dim; c.globalAlpha = 0.6;
    const o1 = Math.sin(t * 1.2 + n) * 4, o2 = Math.cos(t * 0.9 + n) * 4;
    c.fillRect(x + 3 + o1, y + 6, 8, 1);
    c.fillRect(x + 11 + o2, y + 14, 7, 1);
    c.globalAlpha = 0.3; c.fillRect(x + 6 + o2, y + 19, 6, 1);
    c.globalAlpha = 1;
  } },
  // Baum / Pfeiler mit Krone
  'T': { solid: true, draw: (c, x, y, p, t, tx, ty) => {
    c.fillStyle = p.bg; c.fillRect(x, y, T, T);
    const sway = Math.sin(t * 0.8 + noise2(tx, ty) * 7) * 1.2;
    c.fillStyle = p.bgDeep; c.fillRect(x + 9, y + 15, 6, 9);        // Stamm-Schatten
    c.fillStyle = p.dim; c.fillRect(x + 10, y + 14, 4, 10);          // Stamm
    c.fillStyle = p.card; c.fillRect(x + 3 + sway, y + 2, 18, 13);   // Krone
    c.fillStyle = p.cardLight; c.fillRect(x + 5 + sway, y + 3, 14, 6);
    c.fillStyle = p.cardHi; c.fillRect(x + 7 + sway, y + 4, 8, 2);
    c.fillStyle = p.bgDeep; c.fillRect(x + 4 + sway, y + 12, 16, 2);
  } },
  // Pflaster / Weg
  '=': { solid: false, draw: (c, x, y, p, t, tx, ty) => {
    c.fillStyle = p.card; c.fillRect(x, y, T, T);
    c.fillStyle = p.cardLight; c.fillRect(x + 1, y + 1, T - 2, 1);
    c.fillStyle = p.bg; c.fillRect(x, y + T - 1, T, 1); c.fillRect(x + T - 1, y, 1, T);
    if (noise2(tx, ty) > 0.75) { c.fillStyle = p.bgDeep; c.fillRect(x + 6, y + 9, 5, 2); }
  } },
  // Tür, begehbar
  'D': { solid: false, draw: (c, x, y, p, t) => {
    c.fillStyle = p.bgVoid; c.fillRect(x, y, T, T);
    c.fillStyle = p.dim; c.fillRect(x + 2, y, 2, T); c.fillRect(x + T - 4, y, 2, T); c.fillRect(x + 2, y, T - 4, 2);
    const a = 0.15 + 0.12 * Math.sin(t * 2);
    c.globalAlpha = a; c.fillStyle = p.main; c.fillRect(x + 4, y + 2, T - 8, T - 2); c.globalAlpha = 1;
  } },
  // Leylinie, pulsierender Pfad
  '*': { solid: false, draw: (c, x, y, p, t, tx, ty) => {
    c.fillStyle = p.bg; c.fillRect(x, y, T, T);
    const pulse = 0.35 + 0.3 * Math.sin(t * 2.5 - (tx + ty) * 0.5);
    c.globalAlpha = pulse * 0.4; c.fillStyle = p.main; c.fillRect(x + 6, y, 12, T);
    c.globalAlpha = pulse; c.fillStyle = p.glow; c.fillRect(x + 10, y, 4, T);
    c.globalAlpha = 1;
  } },
};

// ------------------------------------------------------------
// CHARAKTER: organische Animation mit Feder-Physik
// ------------------------------------------------------------
// Ein Zustandsobjekt pro Figur. Die Animation entsteht aus
// überlagerten Schwingungen plus nachlaufenden Federn, nicht aus
// festen Einzelbildern. Dadurch wirkt die Bewegung weich.
G.newAnim = () => ({
  phase: 0,        // Laufzyklus 0..1
  speed: 0,        // aktuelle Geschwindigkeit 0..1
  dir: 'down',
  facing: 0,       // weicher Richtungswert für Drehung
  vx: 0, vy: 0,
  cloakX: 0, cloakY: 0, cloakVX: 0, cloakVY: 0, // Umhang, Feder
  hoodX: 0, hoodVX: 0,                          // Kapuze, Feder
  squash: 0, squashV: 0,                        // Stauchen beim Anlaufen/Stoppen
  breathe: Math.random() * 6.28,
  blink: 2 + Math.random() * 3,
  blinking: 0,
  stepFlash: 0,
});

// Federschritt: zieht "val" zu "target", mit Dämpfung
function spring(val, vel, target, stiff, damp, dt) {
  const a = (target - val) * stiff - vel * damp;
  vel += a * dt;
  val += vel * dt;
  return [val, vel];
}

G.updateAnim = (an, dt, vx, vy, moving) => {
  const sp = Math.hypot(vx, vy);
  an.vx = vx; an.vy = vy;

  // Geschwindigkeit weich nachziehen, das killt das Ruckeln beim Start
  const targetSpeed = moving ? Math.min(1, sp / 90) : 0;
  an.speed += (targetSpeed - an.speed) * Math.min(1, dt * 9);

  // Laufzyklus. Frequenz skaliert mit Tempo.
  if (an.speed > 0.02) an.phase = (an.phase + dt * (1.7 + an.speed * 2.1)) % 1;
  else an.phase += (0 - (an.phase % 1)) * Math.min(1, dt * 4); // sanft in Ruhepose

  // Blickrichtung
  if (moving && sp > 4) {
    if (Math.abs(vx) > Math.abs(vy)) an.dir = vx < 0 ? 'left' : 'right';
    else an.dir = vy < 0 ? 'up' : 'down';
  }
  const facingTarget = an.dir === 'left' ? -1 : an.dir === 'right' ? 1 : 0;
  an.facing += (facingTarget - an.facing) * Math.min(1, dt * 12);

  // Umhang läuft der Bewegung hinterher (Sekundäranimation)
  const cloakTargetX = -vx * 0.075, cloakTargetY = -vy * 0.055;
  [an.cloakX, an.cloakVX] = spring(an.cloakX, an.cloakVX, cloakTargetX, 130, 13, dt);
  [an.cloakY, an.cloakVY] = spring(an.cloakY, an.cloakVY, cloakTargetY, 130, 13, dt);

  // Kapuze schwingt leicht gegenläufig
  [an.hoodX, an.hoodVX] = spring(an.hoodX, an.hoodVX, -vx * 0.028, 190, 16, dt);

  // Squash beim Beschleunigen und Abbremsen
  const accel = targetSpeed - an.speed;
  [an.squash, an.squashV] = spring(an.squash, an.squashV, accel * 1.4, 210, 15, dt);

  // Atmen im Stand
  an.breathe += dt * (1.5 + an.speed * 1.2);

  // Blinzeln
  an.blink -= dt;
  if (an.blink <= 0) { an.blinking = 0.11; an.blink = 2.4 + Math.random() * 3.4; }
  if (an.blinking > 0) an.blinking -= dt;

  // Schrittmarker für Staubpartikel
  const st = Math.sin(an.phase * Math.PI * 2);
  const wasDown = an.stepFlash;
  an.stepFlash = (st < -0.9 && an.speed > 0.35) ? 1 : 0;
  return an.stepFlash && !wasDown;
};

// Zeichnet die Figur.
// Sprite-Box 20x30. Aufbau von hinten nach vorn:
// Schatten, Umhang, hinteres Bein, Torso, vorderes Bein, Arme, Kopf.
// Die Silhouette bleibt bewusst schmal, damit die Figur lesbar bleibt.
G.drawPlayer = (c, px, py, an, p, cols, glow) => {
  const R = Math.round;
  const w = Math.sin(an.phase * Math.PI * 2);   // Schrittschwingung
  const w2 = Math.sin(an.phase * Math.PI * 4);  // doppelte Frequenz
  const sp = an.speed;
  const side = (an.dir === 'left' || an.dir === 'right');
  const face = an.dir === 'left' ? -1 : 1;

  const bob = -Math.abs(w2) * 1.6 * sp;                    // Auf und Ab
  const breath = Math.sin(an.breathe) * 0.5 * (1 - sp);     // Atmen im Stand
  const sway = w * 0.9 * sp;                                // Wiegen
  const sq = an.squash;
  const sY = 1 - sq * 0.14, sX = 1 + sq * 0.10;

  const baseY = py + bob + breath;
  const cx = px + 10 + sway * 0.5;
  const footY = py + 29;

  const robe = cols.robe, robeHi = cols.robeHi, trim = cols.trim, core = cols.core;
  const robeDark = cols.robeDark || '#1a1410';
  const dark = '#090503';

  // --- Schatten ---
  c.globalAlpha = 0.34 - sp * 0.08;
  c.fillStyle = '#000';
  c.beginPath();
  c.ellipse(px + 10, footY, (6.5 + sp * 1.5) * sX, 2.4, 0, 0, 6.283);
  c.fill();
  c.globalAlpha = 1;

  // --- Schimmer im Prolog ---
  if (glow) {
    c.globalAlpha = 0.13 + 0.05 * Math.sin(an.breathe * 1.3);
    c.fillStyle = glow;
    c.beginPath(); c.ellipse(px + 10, baseY + 16, 13, 17, 0, 0, 6.283); c.fill();
    c.globalAlpha = 1;
  }

  // --- Umhang, hinter allem, kaum breiter als der Körper ---
  // Er weht entgegen der Laufrichtung und flattert am Saum.
  const clx = an.cloakX, cly = an.cloakY;
  const capeTop = baseY + 11, capeH = 15 * sY;
  c.fillStyle = robeDark;
  if (side) {
    // Seitlich: schmale Fahne, die knapp hinter der Schulter weg steht
    const back = -face;
    const drift = Math.max(-4, Math.min(4, clx * 0.55));
    c.beginPath();
    c.moveTo(R(cx + back * 1.5), R(capeTop));
    c.lineTo(R(cx + back * 3.5 + drift), R(capeTop + capeH * 0.65));
    c.lineTo(R(cx + back * 3 + drift), R(capeTop + capeH));
    c.lineTo(R(cx + back * 0.5), R(capeTop + capeH - 2));
    c.closePath(); c.fill();
  } else {
    const wob = w * 0.9 * sp;
    const drift = Math.max(-3, Math.min(3, clx * 0.7));
    c.beginPath();
    c.moveTo(R(cx - 4), R(capeTop));
    c.lineTo(R(cx - 6 + drift + wob), R(capeTop + capeH));
    c.lineTo(R(cx + 6 + drift + wob), R(capeTop + capeH));
    c.lineTo(R(cx + 4), R(capeTop));
    c.closePath(); c.fill();
  }
  // Saum, flattert leicht nach
  c.fillStyle = robe;
  for (let i = 0; i < 3; i++) {
    const fx = cx - 4 + i * 3.5 + Math.max(-3, Math.min(3, clx * 0.7));
    const fy = capeTop + capeH - 2 + Math.sin(an.phase * 6.283 + i * 1.3) * 1.2 * sp;
    c.fillRect(R(fx), R(fy), 3, 2);
  }

  // --- Beine ---
  // In Robenfarbe, damit sie gegen den dunklen Boden lesbar bleiben.
  const legA = w * 2.4 * sp;      // vorderes Bein
  const legB = -w * 2.4 * sp;     // hinteres Bein
  const liftA = Math.max(0, w) * 1.7 * sp;
  const liftB = Math.max(0, -w) * 1.7 * sp;
  const legTop = baseY + 21;
  const legH = 8;
  function leg(offX, lift, shade) {
    const lx = R(cx + offX), ly = R(legTop - lift), lh = R(legH - lift * 0.6);
    c.fillStyle = shade; c.fillRect(lx, ly, 3, lh);
    c.fillStyle = dark; c.fillRect(lx, ly + lh - 2, 3, 2); // Stiefel
  }
  // hinteres Bein zuerst, etwas dunkler
  leg(side ? -1.5 + legB * face : 1.5, liftB, robe);

  // --- Torso ---
  const bodyW = R(11 * sX), bodyH = R(13 * sY);
  const bodyX = R(cx - bodyW / 2), bodyY = R(baseY + 11);
  c.fillStyle = robe; c.fillRect(bodyX, bodyY, bodyW, bodyH);
  c.fillStyle = robeHi; c.fillRect(bodyX + 1, bodyY + 1, bodyW - 2, 4);
  c.fillStyle = dark; c.fillRect(bodyX, bodyY + bodyH - 1, bodyW, 1);
  // Gürtel, nur ein kurzer Akzent
  c.fillStyle = trim; c.fillRect(bodyX + 2, bodyY + 8, bodyW - 4, 1);

  // --- Leuchtender Kern in der Brust ---
  const pulse = 0.5 + 0.5 * Math.sin(an.breathe * 1.7);
  c.globalAlpha = pulse * 0.35; c.fillStyle = core;
  c.fillRect(bodyX + R(bodyW / 2) - 2, bodyY + 3, 4, 4);
  c.globalAlpha = pulse; c.fillRect(bodyX + R(bodyW / 2) - 1, bodyY + 4, 2, 2);
  c.globalAlpha = 1;

  // --- vorderes Bein, heller als das hintere ---
  leg(side ? -1.5 + legA * face : -4.5, liftA, robeHi);

  // --- Arme ---
  // Bei Frontansicht liegen sie eng am Körper, sonst wirken sie wie Stummel.
  const armS = -w * 2.0 * sp;
  if (side) {
    c.fillStyle = robeHi;
    c.fillRect(R(cx - 1 + armS * face), R(baseY + 13), 3, 7);
    c.fillStyle = trim; c.fillRect(R(cx - 1 + armS * face), R(baseY + 19), 3, 1);
  } else {
    c.fillStyle = dark;
    c.fillRect(R(bodyX - 1), R(baseY + 13 + armS * 0.5), 2, 8);
    c.fillRect(R(bodyX + bodyW - 1), R(baseY + 13 - armS * 0.5), 2, 8);
    c.fillStyle = robeHi;
    c.fillRect(R(bodyX - 1), R(baseY + 13 + armS * 0.5), 1, 7);
    c.fillRect(R(bodyX + bodyW), R(baseY + 13 - armS * 0.5), 1, 7);
  }

  // --- Kopf mit Kapuze ---
  const hx = R(cx - 4 + an.hoodX + an.facing * 0.8);
  const hy = R(baseY + 2 + bob * 0.2);
  // Kapuze als Silhouette
  c.fillStyle = robe;
  c.fillRect(hx - 1, hy + 1, 10, 8);
  c.fillRect(hx, hy, 8, 2);
  c.fillStyle = robeHi; c.fillRect(hx + 1, hy, 6, 2);
  // Gesichtsöffnung
  c.fillStyle = dark;
  if (an.dir === 'up') {
    c.fillRect(hx, hy + 2, 8, 5);   // Rückansicht, keine Öffnung
  } else if (side) {
    c.fillRect(hx + (face > 0 ? 3 : 1), hy + 3, 5, 4);
  } else {
    c.fillRect(hx + 1, hy + 3, 6, 4);
  }
  // Augen
  if (an.dir !== 'up' && an.blinking <= 0) {
    c.fillStyle = core; c.globalAlpha = 0.95;
    if (side) c.fillRect(hx + (face > 0 ? 5 : 2), hy + 4, 2, 2);
    else { c.fillRect(hx + 2, hy + 4, 2, 2); c.fillRect(hx + 5, hy + 4, 2, 2); }
    c.globalAlpha = 1;
  }
  // Kapuzenzipfel hinten
  c.fillStyle = robe;
  if (side) c.fillRect(R(hx + (face > 0 ? -2 : 8)), hy + 2, 2, 4);
};

// ------------------------------------------------------------
// NPC: eigene, ruhigere Animation
// ------------------------------------------------------------
G.drawNpc = (c, px, py, p, variant, t, seed) => {
  const x = Math.round(px), y = Math.round(py);
  const ph = t * 1.1 + (seed || 0) * 2.3;
  const breath = Math.sin(ph) * 0.7;
  const tones = [p.textDim, p.dim, p.text, p.accent];
  const tone = tones[variant % tones.length];

  c.globalAlpha = 0.3; c.fillStyle = '#000';
  c.beginPath(); c.ellipse(x + 10, y + 28, 7, 2.5, 0, 0, 6.283); c.fill();
  c.globalAlpha = 1;

  const by = y + breath;
  c.fillStyle = '#0a0604'; c.fillRect(x + 5, by + 22, 4, 6); c.fillRect(x + 12, by + 22, 4, 6);
  c.fillStyle = tone; c.fillRect(x + 4, by + 9, 13, 14);
  c.fillStyle = p.cardLight; c.fillRect(x + 5, by + 10, 11, 4);
  c.fillStyle = p.textDim; c.fillRect(x + 5, by + 1, 11, 9);
  c.fillStyle = '#0a0604'; c.fillRect(x + 6, by + 4, 9, 5);

  // Variante 0 starrt auf einen Bildschirm: kaltes Flackern vorm Gesicht
  if (variant === 0) {
    const f = 0.4 + 0.35 * Math.sin(t * 9 + (seed || 0));
    c.globalAlpha = f; c.fillStyle = '#8fa8c8';
    c.fillRect(x + 6, by + 12, 9, 6);
    c.globalAlpha = f * 0.4; c.fillRect(x + 4, by + 3, 13, 8);
    c.globalAlpha = 1;
  }
};

// ------------------------------------------------------------
// Begleiter-Geist: schwebt, zieht eine Spur
// ------------------------------------------------------------
G.drawSpirit = (c, px, py, p, t, color, trail) => {
  // Spur
  if (trail) {
    for (let i = trail.length - 1; i >= 0; i--) {
      const tr = trail[i];
      c.globalAlpha = (i / trail.length) * 0.28;
      c.fillStyle = color;
      c.fillRect(Math.round(tr.x), Math.round(tr.y), 3, 3);
    }
  }
  const x = px + Math.sin(t * 1.9) * 3.2;
  const y = py + Math.cos(t * 2.6) * 3.8;
  const pulse = 0.7 + 0.3 * Math.sin(t * 4);
  c.globalAlpha = 0.16 * pulse; c.fillStyle = color;
  c.beginPath(); c.arc(x + 3, y + 3, 9, 0, 6.283); c.fill();
  c.globalAlpha = 0.45 * pulse;
  c.beginPath(); c.arc(x + 3, y + 3, 5, 0, 6.283); c.fill();
  c.globalAlpha = 1;
  c.fillRect(Math.round(x + 1), Math.round(y + 1), 4, 4);
  c.fillStyle = '#fff'; c.globalAlpha = 0.8;
  c.fillRect(Math.round(x + 2), Math.round(y + 2), 2, 2);
  c.globalAlpha = 1;
};

// ------------------------------------------------------------
// Fragment: rotierender Splitter mit Lichthof
// ------------------------------------------------------------
G.drawFragment = (c, px, py, p, t, seed) => {
  const x = px + 12, y = py + 12 + Math.sin(t * 1.6 + (seed || 0)) * 2.5;
  const a = 0.55 + 0.45 * Math.sin(t * 3 + (seed || 0) * 2);
  c.globalAlpha = a * 0.18; c.fillStyle = p.bright;
  c.beginPath(); c.arc(x, y, 13, 0, 6.283); c.fill();
  c.globalAlpha = a * 0.4;
  c.beginPath(); c.arc(x, y, 7, 0, 6.283); c.fill();
  c.globalAlpha = 1;
  // Rotierender Rhombus
  const r = t * 1.4 + (seed || 0);
  c.save(); c.translate(x, y); c.rotate(r);
  c.fillStyle = p.bright; c.fillRect(-2, -7, 4, 14); c.fillRect(-7, -2, 14, 4);
  c.fillStyle = p.textBright; c.fillRect(-2, -2, 4, 4);
  c.restore();
};

// ------------------------------------------------------------
// Spiegelschrein
// ------------------------------------------------------------
G.drawShrine = (c, px, py, p, t) => {
  const x = Math.round(px), y = Math.round(py);
  c.globalAlpha = 0.3; c.fillStyle = '#000';
  c.beginPath(); c.ellipse(x + 24, y + 46, 24, 6, 0, 0, 6.283); c.fill();
  c.globalAlpha = 1;
  // Sockel
  c.fillStyle = p.card; c.fillRect(x + 4, y + 24, 40, 22);
  c.fillStyle = p.cardLight; c.fillRect(x + 6, y + 26, 36, 4);
  c.fillStyle = p.bgDeep; c.fillRect(x + 10, y + 32, 28, 12);
  // Spiegelfläche
  const a = 0.45 + 0.35 * Math.sin(t * 1.8);
  c.globalAlpha = a * 0.3; c.fillStyle = p.main;
  c.beginPath(); c.arc(x + 24, y + 14, 22, 0, 6.283); c.fill();
  c.globalAlpha = 1;
  c.fillStyle = p.bgVoid; c.fillRect(x + 12, y + 2, 24, 24);
  c.fillStyle = p.dim; c.fillRect(x + 12, y + 2, 24, 2); c.fillRect(x + 12, y + 24, 24, 2);
  c.fillRect(x + 12, y + 2, 2, 24); c.fillRect(x + 34, y + 2, 2, 24);
  c.globalAlpha = a; c.fillStyle = p.glow;
  c.fillRect(x + 16, y + 6, 16, 16);
  c.globalAlpha = a * 0.7; c.fillStyle = p.textBright;
  c.fillRect(x + 20, y + 10, 8, 8);
  c.globalAlpha = 1;
};

// ------------------------------------------------------------
// Raum zeichnen
// ------------------------------------------------------------
G.drawRoom = (c, room, p, t) => {
  for (let ty = 0; ty < G.ROOM_H; ty++) {
    const row = room[ty] || '';
    for (let tx = 0; tx < G.ROOM_W; tx++) {
      const ch = row[tx] || '.';
      (G.TILES[ch] || G.TILES['.']).draw(c, tx * T, ty * T, p, t, tx, ty);
    }
  }
};

G.isSolid = (room, px, py) => {
  const tx = Math.floor(px / T), ty = Math.floor(py / T);
  if (tx < 0 || tx >= G.ROOM_W || ty < 0 || ty >= G.ROOM_H) return false;
  const ch = (room[ty] || '')[tx] || '.';
  const tile = G.TILES[ch];
  return tile ? tile.solid : false;
};
