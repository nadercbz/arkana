G.FRAGMENTS = [{"id":"01_Numerologie/chaldaeisch","titel":"Chaldäische Numerologie","text":"Die älteste bekannte Form westlicher Numerologie, stammt aus dem antiken Mesopotamien (Babylonien, Sumer, Akkadien). Wird oft als esoterisch genauer und schwingungssensibler als die pythagoreische Form angesehen.","modul":"01_Numerologie"},{"id":"01_Numerologie/chinesisch","titel":"Chinesische Numerologie","text":"Das chinesische Zahlenwissen ist tief verwoben mit Sprache (Homophonie), Kosmologie (I Ching, Wu Xing) und Feng Shui. Zahlen tragen Glück oder Pech je nach Klangverwandtschaft mit anderen Wörtern.","modul":"01_Numerologie"},{"id":"01_Numerologie/gematria_codes","titel":"Gematria Codes, Universal-Zahlen & moderne Zahlencodes","text":"Sammlung der wichtigsten heiligen, mystischen und kulturell aufgeladenen Zahlen, die immer wieder in Religionen, Mythologie, Wissenschaft und sogar in der Tech- und Crypto-Welt auftauchen.","modul":"01_Numerologie"},{"id":"01_Numerologie/kabbalistisch","titel":"Kabbalistische Numerologie & Gematria","text":"Das hebräisch-mystische System, in dem jeder Buchstabe gleichzeitig ein Zahlenwert, ein Klang, ein Symbol und ein göttlicher Aspekt ist. Grundlage der jüdischen Mystik (Kabbala) und Wurzel vieler westlicher esoterischer Traditionen.","modul":"01_Numerologie"},{"id":"01_Numerologie/pythagoreisch","titel":"Pythagoreische Numerologie","text":"Die im Westen am weitesten verbreitete Form der Numerologie. Basiert auf der Lehre von Pythagoras (ca. 570 bis 495 v. Chr.), der lehrte, dass alles im Universum durch Zahlen beschrieben werden kann. \"Alles ist Zahl\" (πάντα ἀριθμός).","modul":"01_Numerologie"},{"id":"01_Numerologie/vedisch","titel":"Vedische Numerologie (Indische Numerologie, Anka Shastra)","text":"Auch Anka Jyotish oder Anka Shastra (अंक शास्त्र, \"Wissenschaft der Zahlen\") genannt. Untergeordnet zur Jyotish (vedische Astrologie). Verbindet Numerologie mit den 9 Planeten (Navagraha), Karma und Dharma.","modul":"01_Numerologie"},{"id":"02_Astrologie_Planeten/aspekte","titel":"Aspekte — Geometrische Beziehungen der Planeten","text":"Aspekte sind die Winkel zwischen Planeten am Himmel. Sie bestimmen, wie Planeten miteinander interagieren: harmonisch, dynamisch, herausfordernd oder neutral.","modul":"02_Astrologie_Planeten"},{"id":"02_Astrologie_Planeten/klassische_planeten","titel":"Die klassischen Planeten","text":"Die 7 klassischen Planeten (Septenarium) sind das Herz der traditionellen Astrologie: Sonne, Mond, Merkur, Venus, Mars, Jupiter, Saturn.","modul":"02_Astrologie_Planeten"},{"id":"02_Astrologie_Planeten/moderne_planeten","titel":"Die modernen Planeten (Uranus, Neptun, Pluto + Zwergplaneten)","text":"Mit der Entdeckung von Uranus (1781), Neptun (1846), Pluto (1930) erweiterte sich die Astrologie um drei \"transpersonale\" Planeten, die Generationenthemen und kollektive Wandlungen repräsentieren.","modul":"02_Astrologie_Planeten"},{"id":"02_Astrologie_Planeten/retrograde_perioden","titel":"Retrograde Perioden — Wenn Planeten rückwärts laufen","text":"Retrograd (lat. retrogradus, rückwärts gehend) bezeichnet die scheinbare Rückwärtsbewegung eines Planeten am Himmel. Tatsächlich bewegt sich kein Planet rückwärts, sondern es ist ein perspektivisches Phänomen durch unterschiedliche Umlaufgeschwindigkeiten.","modul":"02_Astrologie_Planeten"},{"id":"02_Astrologie_Planeten/transite_2026","titel":"Wichtige Transite 2026","text":"Astronomische Hauptereignisse 2026, mit Schwerpunkt auf den langsamen Planeten, die das kollektive Feld prägen. Daten basieren auf Ephemeriden (Geocentric, Standard).","modul":"02_Astrologie_Planeten"},{"id":"02_Astrologie_Planeten/vedisch_jyotish","titel":"Vedische Astrologie (Jyotish) — Übersicht","text":"Jyotish (ज्योतिष, \"Wissenschaft des Lichts\") ist die indische Schwester der westlichen Astrologie.","modul":"02_Astrologie_Planeten"},{"id":"03_Sternenkonstellationen/aegyptisch_dekane","titel":"Ägyptische Dekane — 36 Sterngruppen","text":"Die ägyptische Astrologie teilte den Himmel in 36 Dekane (je 10° des Zodiaks). Jeder Dekan wurde durch ein Sternbild oder Sterngruppe repräsentiert, hatte eine eigene Gottheit, einen eigenen Charakter und bestimmte Aspekte der Lebenserfahrung.","modul":"03_Sternenkonstellationen"},{"id":"03_Sternenkonstellationen/arabische_mondhaeuser","titel":"Arabische Mondhäuser (Manazil al-Qamar) — 28 Stationen","text":"Die 28 Mondhäuser sind die arabische und persische Entsprechung zu den indischen Nakshatras (27). Sie bilden ein Lunar-Zodiak-System, das den Lauf des Mondes durch den Himmel in einem Monat in 28 Etappen unterteilt.","modul":"03_Sternenkonstellationen"},{"id":"03_Sternenkonstellationen/chinesisch_zodiak","titel":"Chinesischer Zodiak (Shengxiao) — 12 Tiere und 60er-Zyklus","text":"Der chinesische Tierkreis ist Mondkalender-basiert. Jedes Jahr wird einem Tier zugeordnet, jedes Tier wird mit einem von 5 Elementen kombiniert → 60-Jahres-Zyklus (Sexagenarzyklus, Jiazi).","modul":"03_Sternenkonstellationen"},{"id":"03_Sternenkonstellationen/fixsterne","titel":"Wichtige Fixsterne in der Astrologie","text":"Fixsterne sind die \"Sterne\" am Hintergrundhimmel (im Unterschied zu den \"Wandelsternen\" = Planeten). In der traditionellen Astrologie spielen ausgewählte helle Sterne eine bedeutende Rolle. Sie wirken durch Konjunktion zu Planeten oder Häuserspitzen.","modul":"03_Sternenkonstellationen"},{"id":"03_Sternenkonstellationen/maya_tzolkin","titel":"Maya Tzolk'in — Der heilige 260-Tage-Kalender","text":"Der Tzolk'in (auch Tzolkin) ist der heilige Kalender der Maya, basiert auf 260 Tagen, kombiniert 20 Tagessignaturen (Nahuales) mit 13 Tonen. Eines der ältesten und genauesten Kalendersysteme der Welt.","modul":"03_Sternenkonstellationen"},{"id":"03_Sternenkonstellationen/zodiak_siderisch","titel":"Siderischer Zodiak & Ophiuchus","text":"Der siderische Tierkreis basiert auf den tatsächlichen Sternbildern am Himmel, nicht auf der Sonnen-Erde-Beziehung. Er ist Grundlage der vedischen Astrologie und einiger westlich-siderischer Schulen.","modul":"03_Sternenkonstellationen"},{"id":"03_Sternenkonstellationen/zodiak_westlich","titel":"Westlicher (tropischer) Zodiak — 12 Zeichen","text":"Der tropische Tierkreis ist am Frühlingsäquinoktium ausgerichtet (0° Widder = Sonne überquert Äquator nach Norden), nicht an den Sternbildern. Verwendet von der gesamten westlichen Astrologie seit Ptolemäus.","modul":"03_Sternenkonstellationen"},{"id":"04_Mond_Sonnenzyklen/eklipsen_saros","titel":"Eklipsen und der Saros-Zyklus","text":"Eklipsen sind Schlüsselmomente der Astrologie. Sie wirken 3-6 Monate vor und nach dem Ereignis und markieren oft Wendepunkte in Politik, Wirtschaft, persönlichem Leben.","modul":"04_Mond_Sonnenzyklen"},{"id":"04_Mond_Sonnenzyklen/lunation_zyklen","titel":"Lunation-Zyklen — Synodisch, Siderisch, Anomalistisch, Drakonitisch","text":"Der Mond hat mehrere unabhängige Zyklen, die alle leicht unterschiedlich lang sind. Jeder beleuchtet einen anderen Aspekt seiner Bewegung.","modul":"04_Mond_Sonnenzyklen"},{"id":"04_Mond_Sonnenzyklen/mondphasen_grundlagen","titel":"Mondphasen — Grundlagen","text":"Die Mondphasen sind der wichtigste sichtbare Zyklus am Himmel. Sie strukturieren die menschliche Zeit seit der Steinzeit und prägen Pflanzenwachstum, Gezeiten, biologische Rhythmen und magisches Wirken.","modul":"04_Mond_Sonnenzyklen"},{"id":"04_Mond_Sonnenzyklen/seasonal_gates","titel":"Saisonale Tore — Äquinoktien und Sonnenwenden","text":"Die vier saisonalen Tore (zwei Tagundnachtgleichen, zwei Sonnenwenden) sind die wichtigsten kosmischen Marker des Jahres. Sie strukturieren Kalender, Feste und mystische Praxis weltweit.","modul":"04_Mond_Sonnenzyklen"},{"id":"04_Mond_Sonnenzyklen/sonnenzyklen","titel":"Sonnenzyklen — Tagessonne, Schwabe, Hale, Gleisberg, Suess","text":"Die Sonne ist nicht statisch. Sie pulsiert in mehreren Zyklen, die Erd-Klima, Aurora, Telekommunikation und vermutlich auch menschliche Kollektivpsyche beeinflussen.","modul":"04_Mond_Sonnenzyklen"},{"id":"05_Historische_Zyklen/halving_zyklen_btc","titel":"Bitcoin Halving-Zyklen und Astro-Bezug","text":"Alle ca. 4 Jahre (210.000 Blöcke) halbiert sich die Bitcoin-Block-Belohnung. Diese Halvings haben sich als Markt-Zyklen-Treiber etabliert.","modul":"05_Historische_Zyklen"},{"id":"05_Historische_Zyklen/jupiter_saturn_konjunktionen","titel":"Jupiter-Saturn-Konjunktionen — 20-Jahres-Großzyklus","text":"Alle ~20 Jahre treffen sich Jupiter und Saturn am Himmel. Diese Konjunktionen markieren wirtschaftliche und politische Wendepunkte. Alle 200 Jahre wechselt das Element der Konjunktion (Großer Mutationszyklus).","modul":"05_Historische_Zyklen"},{"id":"05_Historische_Zyklen/kondratieff_wellen","titel":"Kondratieff-Wellen (K-Wellen) — 50-60-Jahre-Wirtschaftszyklus","text":"Der russische Ökonom Nikolai Kondratieff (1892-1938) identifizierte langfristige Wellen (~50-60 Jahre) im Kapitalismus. Jede Welle wird von einer Basistechnologie getragen. Joseph Schumpeter ergänzte den Begriff \"schöpferische Zerstörung\".","modul":"05_Historische_Zyklen"},{"id":"05_Historische_Zyklen/maya_long_count","titel":"Maya Long Count — 5125-Jahre-Zyklus","text":"Der Maya Long Count ist eine lineare Tageszählung ab dem 11. August 3114 v. Chr. (proleptisches gregorianisches Datum). Er endete mit dem 13. Baktun am 21. Dezember 2012 und begann einen neuen Zyklus.","modul":"05_Historische_Zyklen"},{"id":"05_Historische_Zyklen/neptun_zyklen","titel":"Neptun-Zyklen — 164-Jahre-Visionsperioden","text":"Neptun braucht ca. 164.8 Jahre für eine Tierkreis-Umrundung. Pro Zeichen ca. 14 Jahre. Er markiert kollektive Visionen, Mythen, Drogenwellen und Auflösung alter Realitäten.","modul":"05_Historische_Zyklen"},{"id":"05_Historische_Zyklen/platonisches_jahr","titel":"Platonisches Jahr — 25.920 Jahre Präzession","text":"Das Platonische Jahr (auch Großes Jahr oder Präzessionszyklus) dauert ca. 25.920 Jahre und beschreibt den Lauf des Frühlingspunkts rückwärts durch die Sternbilder. Jedes Sternbild bildet ein \"Zeitalter\" von ca. 2.160 Jahren.","modul":"05_Historische_Zyklen"},{"id":"05_Historische_Zyklen/pluto_zyklen","titel":"Pluto-Zyklen — 248-Jahre-Großtransformation","text":"Pluto braucht ca. 248 Jahre für eine Umrundung durch den Tierkreis. Pro Zeichen 12-32 Jahre (exzentrische Bahn). Jeder Pluto-Zeichenwechsel markiert tiefe gesellschaftliche Transformation.","modul":"05_Historische_Zyklen"},{"id":"06_Kulturelle_Systeme/aegyptisch","titel":"Ägyptische Mystik","text":"Über 3000 Jahre Hochkultur, Pyramiden, Hieroglyphen, Götterpantheon und kosmologische Lehren. Die ägyptische Tradition ist eine der ältesten und einflussreichsten esoterischen Quellen.","modul":"06_Kulturelle_Systeme"},{"id":"06_Kulturelle_Systeme/afrikanisch_yoruba","titel":"Afrikanische Mystik — Yoruba, Vodun, Ifa","text":"Eine der ältesten lebenden mystischen Traditionen Afrikas, mit globaler Ausstrahlung durch die afrikanische Diaspora (Brasilien Candomblé, Kuba Santería, Haiti Vodou, USA Hoodoo).","modul":"06_Kulturelle_Systeme"},{"id":"06_Kulturelle_Systeme/azteken_inka","titel":"Azteken, Maya, Inka — Präkolumbische Mystik","text":"Drei Hochkulturen Amerikas mit komplexen Kosmologien, präzisen Kalendern und mächtigen Göttern. Maya schon in 03_Sternenkonstellationen/maya_tzolkin.md behandelt; hier Aztec & Inka Fokus.","modul":"06_Kulturelle_Systeme"},{"id":"06_Kulturelle_Systeme/buddhistisch","titel":"Buddhistische Mystik","text":"Lehre des Erwachens. 2500 Jahre alt, mehrere Schulen, von Sri Lanka bis Tibet, von Vietnam bis Japan und heute weltweit.","modul":"06_Kulturelle_Systeme"},{"id":"06_Kulturelle_Systeme/griechisch_roemisch","titel":"Griechisch-Römische Mystik","text":"Klassische Antike-Mystik mit den olympischen Göttern, eleusinischen Mysterien, pythagoreischer Lehre und neuplatonischer Philosophie.","modul":"06_Kulturelle_Systeme"},{"id":"06_Kulturelle_Systeme/hinduistisch","titel":"Hinduistische Mystik","text":"Mit über 1 Milliarde Anhängern eine der ältesten lebenden Traditionen. Veden, Trimurti, Yugas, Chakren, Karma-Reinkarnation.","modul":"06_Kulturelle_Systeme"},{"id":"06_Kulturelle_Systeme/islamisch_sufi","titel":"Islamisch-Sufische Mystik","text":"Sufismus ist die mystische Strömung des Islam, sucht direkte Erfahrung Gottes durch Liebe, Atem, Tanz, Meditation. Wirkte stark auf westliche Esoterik.","modul":"06_Kulturelle_Systeme"},{"id":"06_Kulturelle_Systeme/juedisch_kabbala","titel":"Jüdische Mystik & Kabbala","text":"Jüdische Mystik durch die Jahrhunderte: von der Merkavah-Mystik über Zohar bis Hassidismus und moderne Kabbala. (Numerologische Aspekte ausführlich in `01_Numerologie/kabbalistisch.md`.)","modul":"06_Kulturelle_Systeme"},{"id":"06_Kulturelle_Systeme/keltisch","titel":"Keltische Mystik","text":"Druiden, Ogham-Schrift, Baumkalender, Andersweltliche Reise, Geisterland (Sídhe).","modul":"06_Kulturelle_Systeme"},{"id":"06_Kulturelle_Systeme/nordisch","titel":"Nordische Mystik (Germanisch-Skandinavisch)","text":"Mythologie der Germanen und Wikinger: Yggdrasil, die 9 Welten, Odin, Ragnarök, Runen.","modul":"06_Kulturelle_Systeme"},{"id":"06_Kulturelle_Systeme/shinto","titel":"Shinto — Japanische Mystik","text":"\"Weg der Kami\" (Götter, Geister, Naturwesen). Älteste japanische Religion, animistisch, mit ca. 8 Millionen Kami.","modul":"06_Kulturelle_Systeme"},{"id":"06_Kulturelle_Systeme/taoistisch","titel":"Taoistische (Daoistische) Mystik","text":"Die \"Lehre vom Weg\" — chinesische Mystik, basierend auf Lao Tzu, I Ching, Wu Xing. Verbindet Philosophie, Religion, Magie, Medizin und Geomantie.","modul":"06_Kulturelle_Systeme"},{"id":"07_Weltereignisse_Korrelationen/crypto_meilensteine","titel":"Crypto-Meilensteine — Astrologisch betrachtet","text":"Die wichtigsten Daten der Krypto-Geschichte und ihre planetaren Konstellationen.","modul":"07_Weltereignisse_Korrelationen"},{"id":"07_Weltereignisse_Korrelationen/finanzkrisen_astro","titel":"Finanzkrisen und ihre astrologischen Korrelationen","text":"Historische Wirtschaftskrisen zeigen erstaunliche Übereinstimmungen mit bestimmten planetaren Konstellationen, vor allem Saturn-Pluto- und Saturn-Uranus-Aspekten.","modul":"07_Weltereignisse_Korrelationen"},{"id":"07_Weltereignisse_Korrelationen/kollektive_archetypen","titel":"Kollektive Archetypen und Zeitgeist","text":"Carl Gustav Jung führte den Begriff \"Archetypen\" als universelle Strukturen des kollektiven Unbewussten ein. Sie prägen den \"Zeitgeist\" einer Epoche und manifestieren sich in Kunst, Politik, Mythos, Religion.","modul":"07_Weltereignisse_Korrelationen"},{"id":"07_Weltereignisse_Korrelationen/kriege_zyklen","titel":"Kriegs-Zyklen und Generationen-Muster","text":"Kriege folgen oft generationsbedingten Mustern und planetaren Konstellationen. Studien zeigen ~80-Jahre-Zyklen großer Kriege.","modul":"07_Weltereignisse_Korrelationen"},{"id":"07_Weltereignisse_Korrelationen/pandemien_zyklen","titel":"Pandemien — Historische Zyklen","text":"Pandemien treten in groben 100-Jahres-Mustern auf. Mit COVID-19 (2020) und der nahezu exakten 100-Jahr-Distanz zur Spanischen Grippe (1918) wurde das Bewusstsein dafür wieder aktuell.","modul":"07_Weltereignisse_Korrelationen"},{"id":"07_Weltereignisse_Korrelationen/technologie_durchbrueche","titel":"Technologie-Durchbrüche und planetare Konstellationen","text":"Große Technologie-Durchbrüche korrelieren statistisch mit Uranus-Aspekten (Plötzlichkeit, Innovation), Uranus-Pluto-Konstellationen und Neptun (Vision).","modul":"07_Weltereignisse_Korrelationen"},{"id":"08_Symbolik/alchemie","titel":"Alchemie","text":"Die Alchemie war Vor-Wissenschaft, Mystik, Psychologie und spirituelle Praxis zugleich. Ihr Ziel: Stein der Weisen, Gold-Transmutation, Unsterblichkeit. Innerlich: Transformation des Selbst.","modul":"08_Symbolik"},{"id":"08_Symbolik/farb_symbolik","titel":"Farb-Symbolik","text":"Farben tragen archetypische Bedeutung. Sie wirken auf Psyche, Spiritualität und Magie. Die universellen Bedeutungen variieren leicht je Kultur.","modul":"08_Symbolik"},{"id":"08_Symbolik/heilige_geometrie","titel":"Heilige Geometrie","text":"Geometrische Formen, die in Natur, Architektur und Mystik immer wieder auftauchen. Vom Atom bis zur Galaxie zeigen bestimmte Muster eine universelle Sprache der Struktur.","modul":"08_Symbolik"},{"id":"08_Symbolik/i_ching","titel":"I Ching — Das Buch der Wandlungen","text":"64 Hexagramme als kosmologisches und Orakel-System. Eine der ältesten und tiefsten Bücher der Welt. Beeinflusste Konfuzius, Lao Tzu, Leibniz, Jung, John Cage.","modul":"08_Symbolik"},{"id":"08_Symbolik/runen","titel":"Runen — Elder Futhark","text":"Die ältesten germanischen Schriftzeichen, gleichzeitig Buchstaben, Symbole und Orakel. 24 Zeichen, ab ca. 150 n. Chr. in Skandinavien und Norddeutschland belegt.","modul":"08_Symbolik"},{"id":"08_Symbolik/tarot","titel":"Tarot","text":"78 Karten als Symbol-System: 22 Große Arkana (archetypische Reise) + 56 Kleine Arkana (4 Farben à 14 Karten). Wahrsage-Werkzeug, Meditationsobjekt und Lehrbuch der westlichen Esoterik.","modul":"08_Symbolik"},{"id":"08_Symbolik/tier_symbolik","titel":"Tier-Symbolik","text":"Tiere sind in fast allen Mythologien Boten, Lehrer, Krafttiere. Sie tragen archetypische Energien, die sich in Religion, Heraldik, Astrologie und Schamanismus zeigen.","modul":"08_Symbolik"},{"id":"08_Symbolik/zahlen_universell","titel":"Universelle Zahlen-Symbolik","text":"Diese Datei ergänzt `01_Numerologie/gematria_codes.md`. Hier kompakt die Bedeutungen der wichtigsten Zahlen über alle Kulturen hinweg.","modul":"08_Symbolik"},{"id":"09_Esoterik_Modern/gene_keys","titel":"Gene Keys","text":"Synthese aus Human Design, I Ching, Genetik und Mystik. Entwickelt von Richard Rudd (2007). 64 \"Gene Keys\" entsprechen den 64 I Ching Hexagrammen und 64 Codons der DNA.","modul":"09_Esoterik_Modern"},{"id":"09_Esoterik_Modern/gurdjieff_4ter_weg","titel":"Gurdjieff und der Vierte Weg","text":"Esoterisches System des Armeniers G.I. Gurdjieff (1866-1949), in Russland und Frankreich gelehrt. Synthese aus Sufismus, christlicher Mystik, Yoga, und originellen Beobachtungen.","modul":"09_Esoterik_Modern"},{"id":"09_Esoterik_Modern/hermetik","titel":"Hermetik und das Kybalion","text":"Hermetik geht auf Hermes Trismegistos (\"Dreimal Gewaltigen\") zurück, eine mythische Verschmelzung von Hermes (Griechisch) und Thoth (Ägypten). Ihre Texte (Corpus Hermeticum) prägten die westliche Esoterik tief.","modul":"09_Esoterik_Modern"},{"id":"09_Esoterik_Modern/human_design","titel":"Human Design","text":"System der \"Energie-Typen\" und der individuellen Strategie, 1987 von Ra Uru Hu (Alan Krakower, 1948-2011) empfangen. Synthese aus Astrologie, I Ching, Kabbala, Chakra-System und Quantenphysik.","modul":"09_Esoterik_Modern"},{"id":"09_Esoterik_Modern/schwingungs_skalen","titel":"Schwingungs-Skalen und Frequenzen","text":"In der modernen Esoterik werden bestimmte Frequenzen als \"heilende\" oder \"kosmisch resonante\" Schwingungen bezeichnet. Auch Bewusstseins-Skalen (Hawkins) und Solfeggio-Frequenzen.","modul":"09_Esoterik_Modern"},{"id":"09_Esoterik_Modern/theosophie","titel":"Theosophie","text":"\"Göttliche Weisheit\". Esoterische Bewegung, gegründet 1875 von Helena Blavatsky, mit Anspruch auf eine universale, alle Religionen umfassende Geheimlehre.","modul":"09_Esoterik_Modern"},{"id":"11_Verborgene_Geschichte/antikythera_mechanismus","titel":"Der Antikythera-Mechanismus","text":"Ein Bronzeklumpen aus einem Schiffswrack. Darin über 30 Zahnräder, eine Differentialmechanik und ein Rechenwerk für Sonne, Mond, Finsternisse und Kalender. Rund 2.100 Jahre alt.","modul":"11_Verborgene_Geschichte"},{"id":"11_Verborgene_Geschichte/atlantis","titel":"Atlantis","text":"Der mythische Kontinent, der in einer Nacht im Ozean versank. Erwähnt von Platon, bestätigt durch Edgar Cayce, gespiegelt in zahlreichen Schöpfungsmythen weltweit. Wahrscheinlich keine Erfindung, sondern Erinnerung an eine reale vorsintflutliche Hochkultur.","modul":"11_Verborgene_Geschichte"},{"id":"11_Verborgene_Geschichte/goebekli_tepe","titel":"Göbekli Tepe — Der Tempel, der Geschichte umschreibt","text":"1994 von Klaus Schmidt in Südosttürkei entdeckt. Datiert auf ~9.600 v. Chr. (11.600 Jahre alt) — also älter als Landwirtschaft, Schrift, Töpferei, Rad und Pyramiden. Größere und ältere megalithische Anlage als Stonehenge.","modul":"11_Verborgene_Geschichte"},{"id":"11_Verborgene_Geschichte/kataklysmus_zyklus","titel":"Der 12.000-Jahre-Kataklysmus-Zyklus","text":"Mehrere unabhängige Indizien deuten auf einen regelmäßigen Wiederkehr-Zyklus globaler Katastrophen alle ~12.000 Jahre hin. Wir nähern uns nach 11.600 Jahren seit dem letzten Reset der nächsten Schwelle.","modul":"11_Verborgene_Geschichte"},{"id":"11_Verborgene_Geschichte/piri_reis_karte","titel":"Die Piri-Reis-Karte von 1513","text":"Ein osmanischer Admiral zeichnet 1513 eine Weltkarte auf Gazellenhaut. 400 Jahre später behauptet ein amerikanischer Professor, darauf sei die Antarktis ohne Eis zu sehen. Der Fund ist echt, die These ist populär, die Belegkette ist schwach.","modul":"11_Verborgene_Geschichte"},{"id":"11_Verborgene_Geschichte/pyramiden_global","titel":"Pyramiden global","text":"Pyramiden sind kein ägyptisches Phänomen. Auf allen Kontinenten finden sich pyramidale Bauwerke, oft mit erstaunlich ähnlichen Proportionen und astronomischen Ausrichtungen. Indiz einer globalen vorsintflutlichen Bau-Tradition.","modul":"11_Verborgene_Geschichte"},{"id":"11_Verborgene_Geschichte/sumerische_koenigsliste","titel":"Sumerische Königsliste und die Könige vor der Flut","text":"Eine Keilschrift-Liste aus Mesopotamien zählt Könige auf, die vor einer großen Flut regiert haben. Ihre Regierungszeiten liegen bei 18.600 bis 43.200 Jahren pro Person. Nach der Flut fallen die Zahlen abrupt.","modul":"11_Verborgene_Geschichte"},{"id":"11_Verborgene_Geschichte/tartaria_mudflood","titel":"Tartaria und Mudflood","text":"Eine alternative Geschichtstheorie, die ab 2016/2017 im Internet populär wurde. Behauptet: Es gab im 18./19. Jh. eine global vernetzte Hochkultur namens \"Tartaria\" mit fortgeschrittener Technologie, die bewusst aus der Geschichte gelöscht wurde.","modul":"11_Verborgene_Geschichte"},{"id":"11_Verborgene_Geschichte/younger_dryas","titel":"Younger Dryas — Der Kataklysmus 12.800 v. Chr.","text":"Vor 12.800 Jahren schlug ein Komet (oder mehrere Bruchstücke) auf die Erde, löste Klimasturz aus, brachte Megafauna zum Aussterben und versenkte vermutlich Atlantis. Vor 11.600 Jahren endete die Phase mit erneuter Katastrophe und Sintflut.","modul":"11_Verborgene_Geschichte"},{"id":"12_Geheimgesellschaften/bilderberg","titel":"Bilderberg-Gruppe","text":"Jährliches geheimes Treffen von ~130 Führungspersönlichkeiten aus Politik, Wirtschaft, Adel, Medien, Wissenschaft. Seit 1954. Keine Pressekonferenz, keine Beschlüsse veröffentlicht. Praktisch das wichtigste informelle Welt-Treffen.","modul":"12_Geheimgesellschaften"},{"id":"12_Geheimgesellschaften/economist_covers","titel":"The Economist Cover — Jährliche \"Prophezeiungen\" der Eliten","text":"Seit 1987 veröffentlicht **The Economist** jedes Jahr eine Spezialausgabe **\"The World in...\"** (seit 2020: **\"The World Ahead...\"**) mit einem Cover voller kryptischer Symbole.","modul":"12_Geheimgesellschaften"},{"id":"12_Geheimgesellschaften/freimaurer","titel":"Freimaurerei","text":"Die berühmteste Geheimgesellschaft der Welt. 6 Millionen+ Mitglieder weltweit, präsent in Politik, Wirtschaft, Justiz, Wissenschaft. Verschmelzung antiker Mysterienschulen mit mittelalterlichen Bauhütten.","modul":"12_Geheimgesellschaften"},{"id":"12_Geheimgesellschaften/illuminati","titel":"Illuminati","text":"\"Die Erleuchteten\". Historisch ein bayerischer Geheimbund 1776-1785. Heute Schlüsselbegriff für die Verschwörungstheorie einer Welt-Elite, die im Hintergrund Weltgeschehen lenkt.","modul":"12_Geheimgesellschaften"},{"id":"12_Geheimgesellschaften/jesuiten","titel":"Jesuiten — Gesellschaft Jesu","text":"Der mächtigste katholische Orden. 1540 von Ignatius von Loyola gegründet. Päpste, Politiker, Wissenschaftler in den Reihen. Häufig als \"Geheimsoldaten des Papstes\" bezeichnet. Heute Papst Franziskus (erster Jesuit als Papst, seit 2013).","modul":"12_Geheimgesellschaften"},{"id":"12_Geheimgesellschaften/rosenkreuzer","titel":"Rosenkreuzer","text":"Drei Schriften zwischen 1614 und 1616 lösen in Europa eine Bewegung aus, die es zu diesem Zeitpunkt gar nicht gibt. Der wahrscheinliche Autor nennt sein Werk später einen Scherz.","modul":"12_Geheimgesellschaften"},{"id":"12_Geheimgesellschaften/skull_and_bones","titel":"Skull and Bones","text":"Yale, 1832. Fünfzehn Studenten pro Jahrgang. Drei US-Präsidenten, zwei CIA-Direktoren, ein Dutzend Wall-Street-Dynastien. Der beste dokumentierte Fall dafür, wie ein Elitenetzwerk wirklich funktioniert.","modul":"12_Geheimgesellschaften"},{"id":"12_Geheimgesellschaften/templer","titel":"Tempelritter (Templerorden)","text":"Der berühmteste mittelalterliche Ritterorden. 1118-1307 offiziell aktiv. Reich, mächtig, mystisch. 1307 brutal zerschlagen durch König Philipp IV. von Frankreich. Bewahrer von Geheimnissen, vermutete Vorläufer der Freimaurer und Hüter des Grals.","modul":"12_Geheimgesellschaften"},{"id":"12_Geheimgesellschaften/vatikan_geheimarchiv","titel":"Vatikan Geheimarchiv (Apostolisches Archiv)","text":"85 km Regalfläche. Dokumente seit dem 8. Jahrhundert. Bis 2019 offiziell \"Geheim\". Hütet Wissen, das die offizielle Geschichte umschreiben könnte.","modul":"12_Geheimgesellschaften"},{"id":"12_Geheimgesellschaften/wef","titel":"World Economic Forum (WEF) & Klaus Schwab","text":"Davos-Treffen. Gegründet 1971 von Klaus Schwab. Heute Hauptbühne für globale Eliten und Promotor des \"Great Reset\". Steht für: 4. Industrielle Revolution, Stakeholder-Kapitalismus, KI-Governance, \"Build Back Better\".","modul":"12_Geheimgesellschaften"},{"id":"13_Unterdruecktes_Wissen/big_pharma_rockefeller","titel":"Big Pharma und Rockefeller Medicine","text":"Die moderne Medizin ist nicht \"objektive Wissenschaft\", sondern ein Geschäftsmodell, das seit 1910 systematisch konstruiert wurde durch John D. Rockefeller. Konkurrierende Heilsysteme wurden mit Macht und Geld ausgelöscht.","modul":"13_Unterdruecktes_Wissen"},{"id":"13_Unterdruecktes_Wissen/haarp","titel":"HAARP — Wetter- und Bewusstseins-Modifikation?","text":"High Frequency Active Auroral Research Program. US-Militär-Anlage in Gakona, Alaska. Offiziell: Ionosphären-Forschung. Verschwörungs-Sicht: Wettermanipulation, Erdbeben-Erzeugung, Massen-Mind-Control. Eines der umstrittensten Hochtech-Projekte der Welt.","modul":"13_Unterdruecktes_Wissen"},{"id":"13_Unterdruecktes_Wissen/mind_control_mkultra","titel":"Mind Control und MKUltra","text":"CIA-Programm 1953-1973. Systematische Forschung an Gedankenkontrolle durch Drogen (LSD), Folter, Hypnose, Elektroschocks, sexuellem Missbrauch. Eines der dunkelsten Kapitel moderner Geheimdienst-Geschichte.","modul":"13_Unterdruecktes_Wissen"},{"id":"13_Unterdruecktes_Wissen/operation_paperclip","titel":"Operation Paperclip","text":"Der wichtigste Fall in diesem Modul, weil er keine Legende ist. Über 1600 deutsche Wissenschaftler, viele davon NSDAP-Mitglieder und SS-Offiziere, wurden nach 1945 systematisch in die USA geholt. Ihre Akten wurden gesäubert, ihre Vergangenheit weggeschrieben.","modul":"13_Unterdruecktes_Wissen"},{"id":"13_Unterdruecktes_Wissen/philadelphia_experiment_montauk","titel":"Philadelphia Experiment und Montauk","text":"Die bekannteste Zeitanomalie-Legende des 20. Jahrhunderts. Ein Zerstörer, der 1943 unsichtbar wurde. Matrosen, die mit dem Stahl verschmolzen. Später ein Radarturm auf Long Island, in dem angeblich Zeitreisen und Gedankenkontrolle stattfanden.","modul":"13_Unterdruecktes_Wissen"},{"id":"13_Unterdruecktes_Wissen/royal_rife","titel":"Royal Rife und Frequenz-Heilung","text":"Erfinder eines Mikroskops, das lebende Mikroben in höchster Auflösung sichtbar machte, und eines Frequenz-Generators, der Krankheitserreger gezielt zerstört. Heilte 1934 dokumentiert 14 von 16 als \"unheilbar\" eingestuften Krebspatienten.","modul":"13_Unterdruecktes_Wissen"},{"id":"13_Unterdruecktes_Wissen/schauberger","titel":"Viktor Schauberger — Lebende Wasser-Physik","text":"Österreichischer Förster und Naturphilosoph. Beobachtete Wasser im wilden Zustand, entdeckte Wirbel-Energie (Implosion), entwickelte revolutionäre Konzepte für Energiegewinnung, Wasserreinigung und sogar Anti-Gravitations-Antrieb.","modul":"13_Unterdruecktes_Wissen"},{"id":"13_Unterdruecktes_Wissen/tesla_freie_energie","titel":"Nikola Tesla und Freie Energie","text":"Genialer Erfinder. Lieferte uns Wechselstrom, Funktechnik, Radar-Grundlagen. Aber sein revolutionärstes Werk — drahtlose Energieübertragung — wurde unterdrückt. Sein Vermächtnis ist Schlüssel für ein wahres post-fossiles Zeitalter.","modul":"13_Unterdruecktes_Wissen"},{"id":"13_Unterdruecktes_Wissen/wilhelm_reich","titel":"Wilhelm Reich und die Orgon-Energie","text":"Schüler Freuds. Entdeckte eine kosmische Lebenskraft (Orgon), die er für Heilung, Wetter-Beeinflussung und Bewusstseins-Transformation nutzbar machen wollte. Bücher von der FDA verbrannt 1956, starb im Gefängnis 1957.","modul":"13_Unterdruecktes_Wissen"},{"id":"14_UFOs_UAP_Disclosure/annunaki_sitchin","titel":"Annunaki und Zecharia Sitchin","text":"Babylonische und sumerische Mythen erzählen von \"Anunnaki\" — Göttern, die vom Himmel herabkamen. Zecharia Sitchin (1920-2010) interpretierte ab 1976 diese antiken Texte als Bericht über ein außerirdisches Wesen, das die Menschheit genetisch erschaffen habe.","modul":"14_UFOs_UAP_Disclosure"},{"id":"14_UFOs_UAP_Disclosure/bob_lazar","titel":"Bob Lazar — Area 51, S4, Element 115","text":"1989 trat **Robert Scott Lazar** in einer Fernsehsendung in Las Vegas auf und behauptete: Er habe als Physiker an außerirdischen Raumschiffen in einer Geheimanlage namens S4 nahe Area 51 gearbeitet. Damit begann die moderne Area-51-Folklore.","modul":"14_UFOs_UAP_Disclosure"},{"id":"14_UFOs_UAP_Disclosure/david_grusch_2023","titel":"David Grusch — Whistleblower 2023","text":"Am 26. Juli 2023 sagte ein ehemaliger US-Geheimdienst-Offizier mit Top Secret/SCI-Zugang vor dem US-Kongress unter Eid aus: Die USA besitzt **intakte und teilweise intakte nicht-menschliche Raumfahrzeuge** und **biologische Überreste nicht-menschlicher Wesen**…","modul":"14_UFOs_UAP_Disclosure"},{"id":"14_UFOs_UAP_Disclosure/et_rassen","titel":"Außerirdische Rassen — Übersicht","text":"Aus Channeling, Whistleblower-Berichten, Kontakt-Erfahrungen entsteht ein Bild verschiedener ET-\"Rassen\", die mit der Erde interagieren. Pro-mystische Synthese der wichtigsten zugeschriebenen Spezies.","modul":"14_UFOs_UAP_Disclosure"},{"id":"14_UFOs_UAP_Disclosure/rendlesham_forest_1980","titel":"Rendlesham Forest 1980 — Britanniens Roswell","text":"Ende Dezember 1980, zwischen zwei US-Luftwaffenbasen in Suffolk, sehen Sicherheitspolizisten Lichter im Wald. Drei Nächte lang.","modul":"14_UFOs_UAP_Disclosure"},{"id":"14_UFOs_UAP_Disclosure/roswell_1947","titel":"Roswell 1947","text":"Der berühmteste UFO-Vorfall aller Zeiten. Anfang Juli 1947 stürzte etwas in der Wüste bei Roswell, New Mexico.","modul":"14_UFOs_UAP_Disclosure"},{"id":"14_UFOs_UAP_Disclosure/tic_tac_2004","titel":"Tic Tac UFO — USS Nimitz 2004","text":"Im November 2004 traf eine Trägergruppe der US Navy vor der Küste Kaliforniens auf ein extrem schnelles, \"Tic-Tac\"-förmiges Objekt. F/A-18-Piloten verfolgten es, dokumentierten es mit Bord-Sensoren.","modul":"14_UFOs_UAP_Disclosure"},{"id":"14_UFOs_UAP_Disclosure/vimanas","titel":"Vimanas — Antike Flugmaschinen der Veden","text":"Sanskrit-Texte (3.500+ Jahre alt) beschreiben detailliert fliegende Maschinen (\"Vimanas\") mit Anti-Schwerkraft, Quecksilber-Antrieben, Energie-Strahlen-Waffen.","modul":"14_UFOs_UAP_Disclosure"},{"id":"16_Magick_Okkulte_Systeme/chaos_magick_sigillen","titel":"Chaos Magick und Sigillenmagie","text":"Chaos Magick ist die postmoderne Strömung der westlichen Magie, entstanden Ende der 1970er in England. Ihr Kernsatz: Glaube ist ein Werkzeug, kein Dogma. Statt einem festen Symbolsystem zu folgen, wechselt der Chaos-Magier Paradigmen wie Werkzeuge.","modul":"16_Magick_Okkulte_Systeme"},{"id":"16_Magick_Okkulte_Systeme/enochian_magic","titel":"Enochian — Das Engelsystem von John Dee und Edward Kelley","text":"Zwischen 1582 und 1589 empfingen der Gelehrte John Dee und das Medium Edward Kelley in hunderten Sitzungen ein komplettes magisches System samt eigener Sprache, angeblich diktiert von Engeln.","modul":"16_Magick_Okkulte_Systeme"},{"id":"16_Magick_Okkulte_Systeme/goetia_grimoire_tradition","titel":"Goetia und die Grimoire-Tradition","text":"Grimoires sind die Handbücher der europäischen Magie, entstanden zwischen Spätantike und früher Neuzeit.","modul":"16_Magick_Okkulte_Systeme"},{"id":"16_Magick_Okkulte_Systeme/golden_dawn_ritualmagie","titel":"Westliche Ritualmagie und der Golden Dawn","text":"Der Golden Dawn (gegründet 1888 in London) ist die einflussreichste magische Organisation der westlichen Moderne. Fast alles, was heute unter westlicher Ritualmagie läuft, geht direkt oder indirekt auf sein Curriculum zurück.","modul":"16_Magick_Okkulte_Systeme"},{"id":"16_Magick_Okkulte_Systeme/kabbalistische_magie","titel":"Kabbalistische Magie und Pfad-Arbeit","text":"Der Lebensbaum ist das Betriebssystem der westlichen Magie. Zehn Sphären, zweiundzwanzig Pfade, ein Diagramm, an das seit dem 19. Jahrhundert alles angeschlossen wurde: Tarot, Planeten, Farben, Engel, Räucherwerk, Körperzonen.","modul":"16_Magick_Okkulte_Systeme"},{"id":"16_Magick_Okkulte_Systeme/thelema_crowley","titel":"Thelema und Aleister Crowley","text":"Thelema (griechisch für Wille) ist die religiös-magische Philosophie, die Aleister Crowley 1904 nach dem Empfang des Liber AL vel Legis in Kairo begründete. Kernsatz: Do what thou wilt shall be the whole of the Law.","modul":"16_Magick_Okkulte_Systeme"},{"id":"16_Magick_Okkulte_Systeme/voodoo_vodou","titel":"Vodou — die haitianische Tradition","text":"Vodou ist die am gründlichsten verleumdete Religion der westlichen Hemisphäre. Was Hollywood als Puppen mit Nadeln und wandelnde Tote verkauft, ist in Wirklichkeit ein hochstrukturiertes westafrikanisches Religionssystem, das die Sklaverei überlebt hat und in …","modul":"16_Magick_Okkulte_Systeme"},{"id":"16_Magick_Okkulte_Systeme/wicca_neopagan","titel":"Wicca und Neopaganismus","text":"Wicca ist die einzige größere Religion, die nachweisbar im 20. Jahrhundert in England entstanden ist und sich trotzdem als uralt versteht. Gerald Gardner veröffentlichte 1954 \"Witchcraft Today\" und behauptete, einen überlebenden Hexenkult gefunden zu haben.","modul":"16_Magick_Okkulte_Systeme"},{"id":"17_Heilige_Texte_Verborgen/buch_henoch","titel":"Das Buch Henoch","text":"Ein Buch, das im Judasbrief des Neuen Testaments zitiert wird und trotzdem aus fast allen Bibeln verschwand. Es erzählt vom Fall der Wächter-Engel, von den Nephilim, von Himmelsreisen und von einem Sonnenkalender mit 364 Tagen.","modul":"17_Heilige_Texte_Verborgen"},{"id":"17_Heilige_Texte_Verborgen/dead_sea_scrolls","titel":"Dead Sea Scrolls (Qumran-Rollen)","text":"1947 wirft ein Beduinenjunge einen Stein in eine Höhle bei Qumran und hört Tonkrüge zerbrechen. Was folgt, ist der größte Handschriftenfund des 20. Jahrhunderts: über 900 Manuskripte, bis zu 2000 Jahre alt, darunter die ältesten bekannten Bibeltexte der Welt.","modul":"17_Heilige_Texte_Verborgen"},{"id":"17_Heilige_Texte_Verborgen/enuma_elish","titel":"Enuma Elisch — das babylonische Schöpfungsepos","text":"Sieben Tontafeln aus der Bibliothek von Ninive, ausgegraben ab 1849, erstmals veröffentlicht 1876. Sie erzählen, wie der Gott Marduk die Urmutter Tiamat erschlägt und aus ihrem Körper die Welt baut.","modul":"17_Heilige_Texte_Verborgen"},{"id":"17_Heilige_Texte_Verborgen/evangelium_maria","titel":"Evangelium der Maria","text":"Ein koptischer Papyrus, 1896 in Kairo gekauft, erst 1955 veröffentlicht. Er enthält den einzigen bekannten frühchristlichen Text, der nach einer Frau benannt ist. Der Inhalt ist eine Auseinandersetzung darüber, wer die Botschaft Jesu weitergeben darf.","modul":"17_Heilige_Texte_Verborgen"},{"id":"17_Heilige_Texte_Verborgen/evangelium_thomas","titel":"Das Evangelium nach Thomas","text":"Kein Geburtsbericht, keine Wunder, keine Kreuzigung, keine Auferstehung. Nur 114 Aussprüche Jesu, einer nach dem anderen.","modul":"17_Heilige_Texte_Verborgen"},{"id":"17_Heilige_Texte_Verborgen/gnostische_kosmologie","titel":"Gnostische Kosmologie — Demiurg, Archonten, Pleroma","text":"Die Gnosis stellt eine Frage, die das Christentum lieber nicht gestellt hätte: Wenn Gott gut und allmächtig ist, warum ist diese Welt so, wie sie ist. Ihre Antwort ist radikal.","modul":"17_Heilige_Texte_Verborgen"},{"id":"17_Heilige_Texte_Verborgen/nag_hammadi","titel":"Nag Hammadi Bibliothek","text":"Im Dezember 1945 findet ein ägyptischer Bauer am Fuß des Jabal al-Tarif bei Nag Hammadi einen versiegelten Tonkrug mit dreizehn ledergebundenen Papyrus-Codices. Darin: 52 Schriften, größtenteils gnostisch, die fast 1600 Jahre im Wüstensand lagen.","modul":"17_Heilige_Texte_Verborgen"},{"id":"18_Heilige_Geographie/gizeh_orion","titel":"Gizeh und die Orion-Korrelation","text":"Das Gizeh-Plateau ist der meistuntersuchte heilige Ort der Welt und trotzdem voller offener Fragen.","modul":"18_Heilige_Geographie"},{"id":"18_Heilige_Geographie/goebekli_tepe","titel":"Göbekli Tepe und die Taş Tepeler","text":"Ein Hügel in Südostanatolien hat die Erzählung von der Menschheitsgeschichte umgedreht. Monumentale Steinkreise, rund 11.500 Jahre alt, gebaut von Menschen ohne Töpferei, ohne Metall, ohne Schrift und nach klassischer Lehrmeinung ohne Landwirtschaft.","modul":"18_Heilige_Geographie"},{"id":"18_Heilige_Geographie/ley_lines_earth_grid","titel":"Ley Lines und Earth Grid Theorien","text":"Die Idee: Heilige Stätten liegen nicht zufällig, sondern auf Linien oder in einem geometrischen Gitter, das die Erde überzieht. Von Alfred Watkins' nüchternen Sichtlinien 1921 bis zum planetaren Kristallgitter von Becker und Hagens.","modul":"18_Heilige_Geographie"},{"id":"18_Heilige_Geographie/nazca_lines","titel":"Die Nazca-Linien","text":"In der peruanischen Wüste liegen hunderte Figuren und tausende Linien, manche über einen Kilometer lang, die vom Boden aus kaum als Bild erkennbar sind. Genau diese Tatsache hat sie zum Lieblingsobjekt der Prä-Astronautik gemacht.","modul":"18_Heilige_Geographie"},{"id":"18_Heilige_Geographie/pyramiden_global","titel":"Pyramiden weltweit als globales Phänomen","text":"Pyramiden stehen auf fast jedem Kontinent. Ägypten, Sudan, Mexiko, Peru, China, Indonesien, möglicherweise Europa.","modul":"18_Heilige_Geographie"},{"id":"18_Heilige_Geographie/stonehenge","titel":"Stonehenge und die Sonnenwende-Achse","text":"Stonehenge ist der bekannteste Steinkreis der Welt und gleichzeitig der am gründlichsten missverstandene. Es ist keine Druiden-Anlage, kein Computer und kein Landeplatz.","modul":"18_Heilige_Geographie"},{"id":"19_Prophezeiungen/astro_prognose_2026_2030","titel":"Astro-Prognose 2026-2030","text":"Synthese der wichtigsten astrologischen Konstellationen und Prophezeiungen für die nächsten Jahre. Pro-mystische Lese mehrerer Quellen kombiniert.","modul":"19_Prophezeiungen"},{"id":"19_Prophezeiungen/baba_vanga","titel":"Baba Vanga — Die Bulgarische Sehrin","text":"Vangelija Pandeva Gušterova (1911-1996). Blinde bulgarische Sehrin. Soll über Jahrzehnte hunderte zukünftige Ereignisse korrekt vorhergesagt haben — 9/11, Tsunami 2004, COVID-19 (umstritten), Trump-Wahl, KI-Aufstieg.","modul":"19_Prophezeiungen"},{"id":"19_Prophezeiungen/daniel_prophezeiungen","titel":"Das Buch Daniel","text":"Das älteste vollständig erhaltene apokalyptische Buch der Bibel. Vier Weltreiche, ein Stein der sie alle zerschlägt, siebzig Wochen bis zum Ende. Kein anderer Text hat so viele Endzeitkalender hervorgebracht.","modul":"19_Prophezeiungen"},{"id":"19_Prophezeiungen/edgar_cayce","titel":"Edgar Cayce — Der Schlafende Prophet","text":"Amerikanischer Hellseher (1877-1945). Gab in Trance über 14.000 dokumentierte Readings zu Medizin, Geschichte (Atlantis, Ägypten), zukünftigen Ereignissen, persönlichen Lebensführungen. Eine der best-dokumentierten parapsychologischen Quellen aller Zeiten.","modul":"19_Prophezeiungen"},{"id":"19_Prophezeiungen/fatima_drei_geheimnisse","titel":"Fatima — Die drei Geheimnisse","text":"1917 erschien drei portugiesischen Hirtenkindern bei Fátima die Jungfrau Maria. Sie offenbarte drei Geheimnisse. Die ersten zwei wurden 1941 veröffentlicht. Das dritte wurde bis 2000 versiegelt — und seine \"veröffentlichte Version\" ist bis heute umstritten.","modul":"19_Prophezeiungen"},{"id":"19_Prophezeiungen/hopi_prophezeiung","titel":"Hopi-Prophezeiung","text":"Die Hopi sind ein indigenes Volk im Südwesten der USA (Arizona). Ihre Prophezeiung der \"Großen Reinigung\" wurde 1948 öffentlich gemacht. Sie spricht vom Ende der 4. Welt und dem Eintritt in die 5.","modul":"19_Prophezeiungen"},{"id":"19_Prophezeiungen/johannes_offenbarung","titel":"Die Offenbarung des Johannes","text":"Das letzte Buch des Neuen Testaments. Geschrieben vermutlich um 95 n. Chr. auf der Insel Patmos. Kein Buch der westlichen Welt hat die Vorstellung vom Weltende stärker geprägt. Vier Reiter, sieben Siegel, die Zahl 666, das neue Jerusalem.","modul":"19_Prophezeiungen"},{"id":"19_Prophezeiungen/nostradamus","titel":"Nostradamus","text":"Michel de Nostredame (1503-1566). Französischer Apotheker, Arzt und Seher. Veröffentlichte 1555 \"Les Propheties\" mit 942 vierzeiligen Versen (Quatrains), die in absichtlich verschlüsselter Sprache zukünftige Ereignisse vorhersagen.","modul":"19_Prophezeiungen"},{"id":"19_Prophezeiungen/saint_malachy","titel":"Saint Malachy — Liste der 112 Päpste","text":"Heiliger Malachias (1094-1148), irischer Erzbischof von Armagh. Soll 1139 in Rom eine Vision empfangen haben mit den Namen aller zukünftigen Päpste bis zum letzten Papst \"Petrus Romanus\" und der Zerstörung Roms.","modul":"19_Prophezeiungen"},{"id":"20_Bewusstseinsforschung/dmt_spirit_molecule","titel":"DMT und die Spirit-Molecule-Hypothese","text":"Anfang der 1990er Jahre bekam ein Psychiater in New Mexico als Erster seit über zwanzig Jahren wieder eine US-Genehmigung, ein starkes Psychedelikum am Menschen zu untersuchen.","modul":"20_Bewusstseinsforschung"},{"id":"20_Bewusstseinsforschung/mandela_effekt","titel":"Der Mandela Effekt und die Forschung zu falschen Erinnerungen","text":"Tausende Menschen erinnern sich an dasselbe Detail. Und das Detail existiert nachweislich nicht. Das ist der Mandela Effekt. Die spannende Frage ist nicht, ob die Erinnerungen falsch sind, das sind sie.","modul":"20_Bewusstseinsforschung"},{"id":"20_Bewusstseinsforschung/meditation_neuroscience","titel":"Meditation und Neurowissenschaft","text":"Seit den 2000er Jahren liegen tibetische Mönche mit zehntausenden Stunden Praxis in fMRT-Scannern in Wisconsin. Was dabei herauskam, ist real und messbar, wird aber in der populären Darstellung regelmäßig überzeichnet.","modul":"20_Bewusstseinsforschung"},{"id":"20_Bewusstseinsforschung/nahtoderfahrungen","titel":"Nahtoderfahrungen und die Forschung dazu","text":"Nahtoderfahrungen sind das am besten dokumentierte Phänomen der Bewusstseinsforschung. Millionen Menschen berichten weltweit von strukturell ähnlichen Erlebnissen an der Schwelle des klinischen Todes. Die Frage ist nicht, ob diese Erfahrungen stattfinden.","modul":"20_Bewusstseinsforschung"},{"id":"20_Bewusstseinsforschung/out_of_body","titel":"Außerkörperliche Erfahrungen und das Monroe Institute","text":"Ein Radiomanager aus Virginia beginnt 1958 ungewollt, seinen Körper zu verlassen, dokumentiert es wie ein Ingenieur und baut daraus ein Forschungsinstitut.","modul":"20_Bewusstseinsforschung"},{"id":"20_Bewusstseinsforschung/reinkarnationsforschung","titel":"Reinkarnationsforschung, Stevenson und Tucker","text":"Ein Psychiater der University of Virginia hat vierzig Jahre damit verbracht, Kinder zu interviewen, die von einem früheren Leben erzählen. Er hat dabei über zweitausendfünfhundert Fälle dokumentiert, viele mit Namen, Orten und überprüfbaren Details.","modul":"20_Bewusstseinsforschung"},{"id":"20_Bewusstseinsforschung/remote_viewing","titel":"Remote Viewing und Project Stargate","text":"Über zwanzig Jahre lang bezahlten CIA und US Army Menschen dafür, mit geschlossenen Augen sowjetische Anlagen zu beschreiben. Das Programm hieß zuletzt Stargate, kostete rund 20 Millionen Dollar und wurde 1995 beendet und deklassifiziert.","modul":"20_Bewusstseinsforschung"},{"id":"20_Bewusstseinsforschung/simulationshypothese","titel":"Simulationshypothese, Bostroms Trilemma und das holografische Prinzip","text":"Die populäre Version lautet: \"Ein Oxford Philosoph hat bewiesen, dass wir in einer Simulation leben.\" Das ist falsch. Nick Bostrom hat 2003 etwas viel Vorsichtigeres formuliert, nämlich ein Trilemma. Er sagt nicht, welcher der drei Äste wahr ist.","modul":"20_Bewusstseinsforschung"},{"id":"21_Spirituelle_Anatomie/aurafelder","titel":"Aurafelder. Sieben Schichten, Farben und die Grenze der Prüfbarkeit","text":"Die Aura ist die Vorstellung eines feinstofflichen Feldes, das den Körper umgibt und Zustände des Menschen als Farbe, Struktur und Dichte zeigt.","modul":"21_Spirituelle_Anatomie"},{"id":"21_Spirituelle_Anatomie/chakren_klassisch_vertieft","titel":"Das klassische 7-Chakra-System und seine tantrischen Wurzeln","text":"Chakra (Sanskrit: cakra) bedeutet Rad oder Kreis. Das heute weltbekannte System aus sieben Energiezentren entlang der Wirbelsäule ist keine uralte vedische Universallehre, sondern das Ergebnis einer langen Entwicklung: tantrische Visualisierungspraxis aus dem …","modul":"21_Spirituelle_Anatomie"},{"id":"21_Spirituelle_Anatomie/kundalini","titel":"Kundalini in Tradition und moderner Rezeption","text":"Kundalini bezeichnet in der tantrischen Tradition eine im Körper ruhende göttliche Kraft, dargestellt als zusammengerollte Schlange am unteren Ende der Wirbelsäule. Ihr Aufstieg durch die Chakren gilt als Weg zur Befreiung. Im 20.","modul":"21_Spirituelle_Anatomie"},{"id":"21_Spirituelle_Anatomie/merkaba","titel":"Merkaba. Vom Thronwagen Hesekiels zum Stern-Tetraeder","text":"Merkaba ist heute das Bild zweier gegenläufig rotierender Tetraeder um den menschlichen Körper. Ursprünglich war Merkava etwas völlig anderes: der Thronwagen Gottes in der jüdischen Mystik, ein Text- und Aufstiegsmysterium ohne jede Geometrie.","modul":"21_Spirituelle_Anatomie"},{"id":"21_Spirituelle_Anatomie/nadis_meridiane","titel":"Nadis, Meridiane und Feinstoffkörper","text":"Zwei große Kulturen haben unabhängig voneinander Landkarten des Energieflusses im Körper entwickelt: Indien mit den Nadis, China mit den Meridianen. Dazu kommt die indische Lehre von den Hüllen und Körpern jenseits des physischen Leibes.","modul":"21_Spirituelle_Anatomie"},{"id":"21_Spirituelle_Anatomie/pineal_zirbeldruese","titel":"Zirbeldrüse zwischen Anatomie und Mystik","text":"Die Zirbeldrüse (Epiphyse, englisch pineal gland) ist ein erbsengroßes Organ im Zentrum des Gehirns, das Melatonin produziert.","modul":"21_Spirituelle_Anatomie"},{"id":"21_Spirituelle_Anatomie/subtile_koerper","titel":"Subtile Körper. Ätherleib, Astralleib, Mentalleib, Kausalleib","text":"Fast jede kontemplative Tradition beschreibt den Menschen als Schichtung mehrerer Körper, nicht als einen. Die westliche Fassung mit Ätherleib, Astralleib, Mentalleib und Kausalleib ist allerdings jünger, als sie tut. Sie ist eine Synthese des 19.","modul":"21_Spirituelle_Anatomie"},{"id":"22_Banned_Books/bibel_apokryphen","titel":"Bibel-Apokryphen. Welche Bücher wann herausfielen","text":"Die verbreitetste Erzählung lautet, das Konzil von Nicäa habe 325 die Bibel zusammengestellt und den Rest verboten. Das ist historisch falsch, und zwar nachweisbar.","modul":"22_Banned_Books"},{"id":"22_Banned_Books/bibliothek_alexandria","titel":"Die Bibliothek von Alexandria und andere zerstörte Bibliotheken","text":"Die größte Wissenssammlung der Antike verschwand nicht in einer einzigen Nacht. Sie starb über Jahrhunderte, durch Krieg, Budgetkürzungen, religiösen Eifer und Gleichgültigkeit.","modul":"22_Banned_Books"},{"id":"22_Banned_Books/index_librorum_prohibitorum","titel":"Index Librorum Prohibitorum. Die Verbotsliste des Vatikans","text":"Über 400 Jahre führte die katholische Kirche eine offizielle Liste verbotener Bücher, von 1559 bis 1966. Wer darauf stand, liest sich heute wie ein Kanon der westlichen Geistesgeschichte: Kopernikus, Galilei, Kant, Sartre.","modul":"22_Banned_Books"},{"id":"22_Banned_Books/maya_codices","titel":"Die Maya-Codices. Mani 1562 und der Verlust einer Schriftkultur","text":"Die Maya besaßen eine voll entwickelte Schrift und eine Bibliothekskultur aus bemalten Faltbüchern. Heute existieren davon vier.","modul":"22_Banned_Books"},{"id":"22_Banned_Books/tesla_papiere","titel":"Die Tesla-Papiere. Beschlagnahme 1943, Trump-Gutachten, Aktenlage","text":"Nikola Tesla stirbt am 7. Januar 1943 allein in einem New Yorker Hotelzimmer. Innerhalb von Tagen beschlagnahmt eine US-Behörde seinen gesamten Nachlass. Ein MIT-Physiker begutachtet die Papiere und erklärt sie für harmlos.","modul":"22_Banned_Books"},{"id":"22_Banned_Books/vatikan_geheimarchiv","titel":"Das Vatikanische Geheimarchiv. Fakten, Zugang, Mythen","text":"85 Kilometer Regale, rund 12 Jahrhunderte Dokumente, ein Name, der jahrhundertelang \"geheim\" hieß.","modul":"22_Banned_Books"},{"id":"23_Chinesische_Metaphysik/bazi_vier_saeulen","titel":"BaZi — Die Vier Säulen des Schicksals","text":"BaZi (八字, \"acht Zeichen\") ist das Kernsystem der chinesischen Schicksalsanalyse. Aus Jahr, Monat, Tag und Stunde der Geburt entstehen vier Säulen mit je zwei Zeichen, also acht Zeichen insgesamt.","modul":"23_Chinesische_Metaphysik"},{"id":"23_Chinesische_Metaphysik/fuenf_elemente_wandlungsphasen","titel":"Wu Xing — Die fünf Wandlungsphasen","text":"Wu Xing (五行) heißt wörtlich \"fünf Gänge\" oder \"fünf Bewegungen\", nicht \"fünf Elemente\". Das ist der entscheidende Unterschied zur westlichen Elementenlehre: es geht nicht um Baustoffe, sondern um Phasen einer Wandlung.","modul":"23_Chinesische_Metaphysik"},{"id":"23_Chinesische_Metaphysik/stamm_zweig_kalender","titel":"Stamm-Zweig-Kalender — Der Sexagesimalzyklus und die Säulen 2026/2027","text":"Der Ganzhi-Kalender (干支) kombiniert zehn Himmelsstämme mit zwölf Erdzweigen zu 60 einzigartigen Paaren. Er läuft für Jahre, Monate, Tage und Stunden parallel und ist die operative Grundlage für jede Zeitqualitäts-Analyse.","modul":"23_Chinesische_Metaphysik"}];

  const vals = { a:1,b:2,c:3,d:4,e:5,f:6,g:7,h:8,i:9,j:1,k:2,l:3,m:4,n:5,o:6,p:7,q:8,r:9,s:1,t:2,u:3,v:4,w:5,x:6,y:7,z:8 };
  const clean = name.toLowerCase().replace(/ä/g,'ae').replace(/ö/g,'oe').replace(/ü/g,'ue').replace(/ß/g,'ss');
  let sum = 0;
  for (const ch of clean) if (vals[ch]) sum += vals[ch];
  if (sum === 0) sum = 9;
  while (sum > 9 && sum !== 11 && sum !== 22 && sum !== 33) {
    sum = String(sum).split('').reduce((a, d) => a + Number(d), 0);
  }
  return sum;
};

// ============================================================
// KARTEN-BAUKASTEN
// Räume sind 9 Zeichen breit, 14 hoch (je 40px = 360x560).
// Der Baukasten garantiert korrekte Maße und Durchgänge.
// ============================================================
const RW = 9, RH = 14;
const MX = 4, MY = 7;   // Mitte, dort liegen die Durchgänge

function room(exits, fill = '.', wall = '#') {
  const g = [];
  for (let y = 0; y < RH; y++) {
    const row = [];
    for (let x = 0; x < RW; x++) {
      row.push((x === 0 || x === RW - 1 || y === 0 || y === RH - 1) ? wall : fill);
    }
    g.push(row);
  }
  // Durchgänge, 3 Felder breit, in der Kantenmitte
  if (exits.n) for (let x = MX - 1; x <= MX + 1; x++) g[0][x] = fill;
  if (exits.s) for (let x = MX - 1; x <= MX + 1; x++) g[RH - 1][x] = fill;
  if (exits.w) for (let y = MY - 1; y <= MY + 1; y++) g[y][0] = fill;
  if (exits.o) for (let y = MY - 1; y <= MY + 1; y++) g[y][RW - 1] = fill;
  return g;
}
function put(g, x, y, ch) { if (g[y] && g[y][x] !== undefined) g[y][x] = ch; }
function rect(g, x1, y1, x2, y2, ch) { for (let y = y1; y <= y2; y++) for (let x = x1; x <= x2; x++) put(g, x, y, ch); }
function hline(g, y, x1, x2, ch) { for (let x = x1; x <= x2; x++) put(g, x, y, ch); }
function vline(g, x, y1, y2, ch) { for (let y = y1; y <= y2; y++) put(g, x, y, ch); }
function toStrings(g) { return g.map((r) => r.join('')); }

// ------------------------------------------------------------
// PROLOG: die graue Stadt
// ------------------------------------------------------------
function buildStadt() {
  const rooms = {};

  // Zentrum: Kreuzung
  let g = room({ n: true, s: true, w: true, o: true });
  hline(g, 4, 1, 7, '='); hline(g, 9, 1, 7, '=');
  vline(g, 3, 1, 12, '='); vline(g, 5, 1, 12, '=');
  put(g, 1, 2, 'T'); put(g, 7, 2, 'T'); put(g, 1, 11, 'T'); put(g, 7, 11, 'T');
  rooms['1,1'] = toStrings(g);

  // Westen: Platz
  g = room({ o: true });
  hline(g, 3, 2, 6, '='); hline(g, 10, 2, 6, '=');
  put(g, 2, 6, 'T'); put(g, 6, 6, 'T');
  rooms['0,1'] = toStrings(g);

  // Osten: Gasse mit Häuserfront
  g = room({ w: true, s: true });
  rect(g, 1, 1, 3, 4, '#'); rect(g, 2, 2, 2, 3, 'W');
  rect(g, 5, 1, 7, 4, '#'); rect(g, 6, 2, 6, 3, 'W');
  vline(g, 4, 1, 12, '=');
  put(g, 2, 10, 'T'); put(g, 6, 10, 'T');
  rooms['2,1'] = toStrings(g);

  // Norden: Park am Wasser
  g = room({ s: true });
  rect(g, 1, 1, 7, 3, '~');
  put(g, 2, 6, 'T'); put(g, 6, 6, 'T'); put(g, 4, 10, 'T');
  hline(g, 8, 1, 7, '=');
  rooms['1,0'] = toStrings(g);

  // Süden: Ladenzeile mit dem flackernden Laden
  g = room({ n: true, o: true });
  rect(g, 2, 5, 6, 8, '#');
  rect(g, 3, 6, 5, 7, 'W');
  put(g, 4, 8, 'D');
  put(g, 1, 11, 'T'); put(g, 7, 11, 'T');
  rooms['1,2'] = toStrings(g);

  // Südost: Sackgasse, von Westen und von Norden erreichbar
  g = room({ w: true, n: true });
  rect(g, 2, 5, 6, 6, '#');
  put(g, 3, 10, 'T'); put(g, 5, 10, 'T');
  rooms['2,2'] = toStrings(g);

  return {
    pal: 'gray',
    rooms,
    npcs: {
      '1,1': [ { x: 2, y: 6, v: 0, dlg: 'stadt_pendler' }, { x: 6, y: 10, v: 1, dlg: 'stadt_meckerer' } ],
      '0,1': [ { x: 4, y: 6, v: 0, dlg: 'stadt_scroller' } ],
      '2,1': [ { x: 6, y: 7, v: 2, dlg: 'stadt_alte_frau' } ],
      '1,0': [ { x: 4, y: 5, v: 1, dlg: 'stadt_parkmann' } ],
      '1,2': [ { x: 2, y: 11, v: 3, dlg: 'stadt_kind' } ],
      '2,2': [ { x: 4, y: 8, v: 1, dlg: 'stadt_obdachloser' } ],
    },
    triggers: { '1,2': [ { x1: 3, y1: 8, x2: 5, y2: 8, event: 'laden' } ] },
    ambient: 'regen',
  };
}

G.TitleScene = () => {
  let t = 0; let sel = 0;
  const hasSave = !!G.load();
  const opts = hasSave ? ['WEITERSPIELEN', 'NEUES SPIEL'] : ['NEUES SPIEL'];
  const stars = [];
  const rng = G.mulberry32(7);
  for (let i = 0; i < 90; i++) stars.push({ x: rng() * G.W, y: rng() * G.H, s: rng(), sz: rng() > 0.9 ? 2 : 1 });
  return {
    update(dt) {
      t += dt;
      if (G.input.pressed('up') || G.input.pressed('down')) sel = (sel + 1) % opts.length;
      if (G.input.pressed('action')) {
        if (opts[sel] === 'WEITERSPIELEN') {
          G.state = G.load();
          G.pal = G.state.phase === 'arkana' ? G.PAL.amber : G.PAL.gray;
          G.replaceScene(G.OverworldScene());
        } else {
          G.clearSave(); G.state = G.newState(); G.pal = G.PAL.gray;
          G.state.px = G.CITYMAP.START[0]; G.state.py = G.CITYMAP.START[1];
          G.replaceScene(G.IntroScene());
        }
      }
    },
    draw(c) {
      const p = G.PAL.amber;
      c.fillStyle = p.bgVoid; c.fillRect(0, 0, G.W, G.H);
      for (const s of stars) {
        c.globalAlpha = 0.2 + 0.6 * Math.abs(Math.sin(t * (0.4 + s.s) + s.x));
        c.fillStyle = p.text; c.fillRect(s.x, s.y, s.sz, s.sz);
      }
      c.globalAlpha = 1;
      // Ring aus Zeichen, dreht sich langsam
      c.save(); c.translate(G.W / 2, G.SAFE_Y + 210); c.rotate(t * 0.08);
      for (let i = 0; i < 22; i++) {
        const a = (i / 22) * 6.283;
        c.globalAlpha = 0.16 + 0.14 * Math.sin(t * 1.5 + i);
        c.fillStyle = p.main;
        c.fillRect(Math.cos(a) * 108 - 2, Math.sin(a) * 108 - 2, 4, 4);
      }
      c.restore(); c.globalAlpha = 1;

      const SY = G.SAFE_Y;
      G.textGlow(c, '⚡', G.W / 2, SY + 168, p.main, 34);
      G.textGlow(c, 'ARKANA', G.W / 2, SY + 226, p.bright, 46);
      G.text(c, 'D A S   V E R B O R G E N E   M U S T E R', G.W / 2, SY + 282, p.text, 18, 'center');

      opts.forEach((o, i) => {
        const y = SY + 400 + i * 40;
        const on = i === sel;
        if (on) {
          c.globalAlpha = 0.14 + 0.06 * Math.sin(t * 4);
          c.fillStyle = p.main; c.fillRect(50, y - 8, G.W - 100, 32); c.globalAlpha = 1;
          G.text(c, '▶', 62, y, p.main, 16);
        }
        G.text(c, o, G.W / 2, y, on ? p.textBright : p.textDim, 16, 'center');
      });
      G.text(c, 'Wischen oder Pfeiltasten zum Bewegen', G.W / 2, G.H - 62, p.textDim, 14, 'center');
      G.text(c, 'OK bestätigt · MENÜ öffnet den Codex', G.W / 2, G.H - 44, p.textDim, 14, 'center');
      G.vignette(c, 0.5);
    },
  };
};

// ------------------------------------------------------------
// Persönliche Deutung: verbindet ein Fragment mit der Signatur
// ------------------------------------------------------------
G.deutungFor = (frag) => {
  const s = G.state && G.state.sig;
  const d = G.DEUTUNG && G.DEUTUNG[frag.modul];
  if (!s || !d) return null;
  // Welche Achse gezeigt wird, hängt am Fragment selbst. So bekommt
  // der Spieler über die Sammlung hinweg alle drei Blickwinkel.
  const achsen = ['element', 'zahl', 'phase'];
  const pick = achsen[G.hashStr(frag.id) % 3];
  let kern = '';
  if (pick === 'element') kern = d.element[s.element];
  else if (pick === 'zahl') kern = d.zahl[s.zahl];
  else kern = d.phase[s.saturn.name];
  if (!kern) kern = d.element[s.element] || d.zahl[s.zahl] || '';
  return {
    intro: (d.intro || '').replace(/\{name\}/g, s.name),
    kern,
    achse: pick,
    thema: d.thema || '',
  };
};

// Gesamtbild aus allen gesammelten Fragmenten
G.buildGesamtbild = () => {
  const s = G.state.sig, st = G.state.stats, GB = G.GESAMTBILD;
  const n = G.state.fragmente.length, total = G.FRAGMENTS.length;
  const anteil = total ? n / total : 0;
  const stufe = anteil >= 0.999 ? 'alle' : anteil >= 0.5 ? 'viel' : anteil >= 0.2 ? 'mittel' : 'wenig';
  const haltung = st.geprueft > st.geglaubt * 1.3 ? 'zweifel'
    : st.geglaubt > st.geprueft * 1.3 ? 'glaube' : 'gleichgewicht';
  const seiten = [];
  seiten.push(`${s.name.toUpperCase()}\n${s.sym} ${s.zeichen} · ${s.element} · ${s.planet}\nNamenszahl ${s.zahl} · ${s.gabe.name}\n${s.saturn.name}\n\nFragmente: ${n} von ${total}`);
  seiten.push(GB.eroeffnung[stufe]);
  seiten.push(GB.element[s.element]);
  seiten.push(GB.zahl[s.zahl] || GB.zahl[9]);
  seiten.push(GB.phase[s.saturn.name]);
  seiten.push(GB.haltung[haltung]);
  // Die gesammelten Themen als Spur der eigenen Reise
  const module = [...new Set(G.state.fragmente.map((id) => {
    const f = G.FRAGMENTS.find((x) => x.id === id); return f ? f.modul : null;
  }).filter(Boolean))];
  if (module.length) {
    const themen = module.map((m) => (G.DEUTUNG[m] && G.DEUTUNG[m].thema) || '').filter(Boolean);
    if (themen.length) seiten.push('Deine Spur führte durch:\n\n' + themen.join(', ') + '.');
  }
  seiten.push(GB.schluss);
  return seiten;
};

// ------------------------------------------------------------

G.FragmentScene = (frag) => {
  let sel = 0; let stage = 0; let t = 0; let appear = 0;
  const deut = G.deutungFor(frag);
  return {
    translucent: true,
    enter() { G.doShake(2, 0.2); },
    update(dt) {
      t += dt; appear = Math.min(1, appear + dt * 3.5);
      if (stage === 0) { if (G.input.pressed('action')) stage = deut ? 1 : 2; }
      else if (stage === 1) { if (G.input.pressed('action')) stage = 2; }
      else {
        if (G.input.pressed('left') || G.input.pressed('right')) sel = 1 - sel;
        if (G.input.pressed('action')) {
          if (sel === 0) G.state.stats.geglaubt++; else G.state.stats.geprueft++;
          G.state.fragmente.push(frag.id);
          for (let i = 0; i < 16; i++) {
            G.spawnParticle({ x: G.W / 2, y: G.H / 2, vx: (Math.random() - 0.5) * 90, vy: (Math.random() - 0.5) * 90,
              life: 0.8, fade: 0.8, color: G.pal.bright, size: 2 });
          }
          G.save(); G.popScene();
        }
      }
    },
    draw(c) {
      const p = G.pal;
      c.globalAlpha = 0.72 * appear; c.fillStyle = '#000'; c.fillRect(0, 0, G.W, G.H); c.globalAlpha = 1;
      const h = 400, y0 = (G.H - h) / 2;
      c.globalAlpha = appear;
      c.fillStyle = p.bgVoid; c.fillRect(24, y0, G.W - 48, h);
      c.strokeStyle = p.main; c.lineWidth = 2; c.strokeRect(25, y0 + 1, G.W - 50, h - 2);
      // Ecken
      c.fillStyle = p.bright;
      [[26, y0 + 2], [G.W - 40, y0 + 2], [26, y0 + h - 16], [G.W - 40, y0 + h - 16]].forEach(([bx, by]) => {
        c.fillRect(bx, by, 14, 3); c.fillRect(bx, by, 3, 14);
      });
      G.textGlow(c, '✦', G.W / 2, y0 + 24, p.main, 26);
      if (stage <= 0) {
        G.text(c, 'WISSENSFRAGMENT', G.W / 2, y0 + 60, p.main, 15, 'center');
        const tl = G.wrapText(c, frag.titel, G.W - 80, 19);
        tl.slice(0, 2).forEach((l, i) => G.text(c, l, G.W / 2, y0 + 84 + i * 20, p.textBright, 16, 'center'));
        const wrapped = G.wrapText(c, frag.text, G.W - 76, 16);
        wrapped.slice(0, 11).forEach((l, i) => G.text(c, l, 38, y0 + 132 + i * 19, p.text, 16));
      } else {
        // Der persönliche Teil: was das Thema über den Spieler sagt
        const label = { element: 'DEIN ELEMENT', zahl: 'DEINE ZAHL', phase: 'DEINE PHASE' }[deut.achse];
        G.text(c, label, G.W / 2, y0 + 60, p.main, 15, 'center');
        const s2 = G.state.sig;
        const sub = { element: `${s2.element} · ${s2.sym} ${s2.zeichen}`, zahl: `${s2.zahl} · ${s2.gabe.name}`, phase: s2.saturn.name }[deut.achse];
        G.text(c, sub, G.W / 2, y0 + 84, p.textBright, 17, 'center');
        let yy = y0 + 122;
        G.wrapText(c, deut.intro, G.W - 76, 15).slice(0, 4).forEach((l) => { G.text(c, l, 38, yy, p.textDim, 15); yy += 19; });
        yy += 10;
        c.fillStyle = p.main; c.globalAlpha = 0.5 * appear; c.fillRect(38, yy - 6, G.W - 76, 1); c.globalAlpha = appear;
        yy += 8;
        G.wrapText(c, deut.kern, G.W - 76, 17).slice(0, 7).forEach((l) => { G.text(c, l, 38, yy, p.textBright, 17); yy += 22; });
      }
      if (stage <= 1) {
        if (Math.floor(t * 2) % 2 === 0) G.text(c, '[ OK ]', G.W / 2, y0 + h - 40, p.textDim, 16, 'center');
      } else {
        G.text(c, 'Wie gehst du damit um?', G.W / 2, y0 + h - 78, p.textBright, 19, 'center');
        const bw = 118;
        [['GLAUBEN', G.W / 2 - 66], ['PRÜFEN', G.W / 2 + 66]].forEach(([label, bx], i) => {
          const on = sel === i;
          if (on) { c.fillStyle = p.main; c.globalAlpha = 0.2; c.fillRect(bx - bw / 2, y0 + h - 52, bw, 30); c.globalAlpha = appear; }
          c.strokeStyle = on ? p.main : p.textDim; c.lineWidth = on ? 2 : 1;
          c.strokeRect(bx - bw / 2, y0 + h - 52, bw, 30);
          G.text(c, label, bx, y0 + h - 44, on ? p.textBright : p.textDim, 14, 'center');
        });
      }
      c.globalAlpha = 1;
    },
  };
};

// ------------------------------------------------------------
// Codex
// ------------------------------------------------------------
G.CodexScene = () => {
  let sel = 0; let reading = null; let tab = 0;
  const list = () => G.state.fragmente.map((id) => G.FRAGMENTS.find((f) => f.id === id)).filter(Boolean);
  return {
    translucent: true,
    update() {
      const items = list();
      if (reading) { if (G.input.pressed('action') || G.input.pressed('cancel')) reading = null; return; }
      if (G.input.pressed('cancel')) { G.popScene(); return; }
      if (G.input.pressed('up')) sel = Math.max(0, sel - 1);
      if (G.input.pressed('down')) sel = Math.min(Math.max(items.length - 1, 0), sel + 1);
      if ((G.input.pressed('left') || G.input.pressed('right')) && G.state.sig) tab = 1 - tab;
      if (G.input.pressed('action') && items.length && tab === 0) reading = items[sel];
    },
    draw(c) {
      const p = G.pal; const s = G.state.sig;
      c.globalAlpha = 0.9; c.fillStyle = p.bgVoid; c.fillRect(0, 0, G.W, G.H); c.globalAlpha = 1;
      c.strokeStyle = p.dim; c.lineWidth = 2; c.strokeRect(13, 13, G.W - 26, G.H - 26);

      if (reading) {
        G.text(c, '✦', 30, G.SAFE_Y + 30, p.main, 18);
        const tl = G.wrapText(c, reading.titel, G.W - 80, 19);
        tl.slice(0, 2).forEach((l, i) => G.text(c, l, G.W / 2, G.SAFE_Y + 34 + i * 20, p.main, 16, 'center'));
        const wrapped = G.wrapText(c, reading.text, G.W - 70, 17);
        wrapped.slice(0, Math.floor((G.H - 200) / 22)).forEach((l, i) => G.text(c, l, 35, G.SAFE_Y + 100 + i * 22, p.text, 17));
        G.text(c, reading.modul.replace(/_/g, ' '), G.W / 2, G.H - 70, p.textDim, 14, 'center');
        G.text(c, '[ OK ] zurück', G.W / 2, G.H - 46, p.textDim, 15, 'center');
        return;
      }

      G.textGlow(c, '⚡ CODEX', G.W / 2, G.SAFE_Y + 30, p.main, 20);

      ['FRAGMENTE', 'SIGNATUR'].forEach((label, i) => {

      if (tab === 1 && s) {
        const rows = [
          ['Name', s.name], ['Zeichen', `${s.sym} ${s.zeichen}`], ['Element', s.element],
          ['Herrscher', s.planet], ['Namenszahl', `${s.zahl} · ${s.gabe.name}`],
          ['Lebensphase', s.saturn.name], ['Begleiter', s.spirit.name],
          ['Licht', s.licht], ['Schatten', s.schatten],
        ];
        rows.forEach(([k, v], i) => {
          const y = G.SAFE_Y + 112 + i * 34;
          G.text(c, k.toUpperCase(), 34, y, p.textDim, 11);
          G.text(c, String(v), G.W - 34, y + 12, p.textBright, 15, 'right');
          c.fillStyle = p.card; c.fillRect(34, y + 30, G.W - 68, 1);
        });
        G.text(c, `Geglaubt ${G.state.stats.geglaubt} · Geprüft ${G.state.stats.geprueft}`, G.W / 2, G.H - 74, p.text, 18, 'center');
      } else {
        const items = list();
        G.text(c, `${items.length} von ${G.FRAGMENTS.length} Fragmenten`, G.W / 2, G.SAFE_Y + 100, p.text, 19, 'center');
        if (!items.length) {
          G.text(c, 'Noch nichts gesammelt.', G.W / 2, G.H / 2 - 20, p.textDim, 14, 'center');
        } else {
          const per = Math.max(8, Math.floor((G.H - 260) / 36)); const start = Math.max(0, Math.min(sel - 5, items.length - per));
          items.slice(start, start + per).forEach((f, i) => {
            const idx = start + i, y = G.SAFE_Y + 132 + i * 36;
            const on = idx === sel;
            if (on) { c.fillStyle = p.main; c.globalAlpha = 0.14; c.fillRect(26, y - 6, G.W - 52, 32); c.globalAlpha = 1; G.text(c, '▶', 32, y + 2, p.main, 13); }
            const short = f.titel.length > 26 ? f.titel.slice(0, 25) + '…' : f.titel;
            G.text(c, short, 50, y, on ? p.textBright : p.text, 14);
            G.text(c, f.modul.slice(0, 2), G.W - 34, y + 3, p.textDim, 10, 'right');
          });
        }
      }
      G.text(c, `[◀▶] Reiter   [MENÜ] schließen`, G.W / 2, G.H - 46, p.textDim, 14, 'center');
    },
  };
};

G.buildReading = () => {
  const s = G.state.sig; const st = G.state.stats;
  const lines = [];
  lines.push(`Ich sehe dich, ${s.name}. Geboren im Zeichen ${s.zeichen}, unter der Führung von ${s.planet}.`);
  lines.push(`Deine Namenszahl ist die ${s.zahl}. ${s.gabe.text}`);
  lines.push(`${s.saturn.name}. ${s.saturn.text}`);
  if (st.geglaubt + st.geprueft > 0) {
    if (st.geprueft > st.geglaubt) lines.push('Du prüfst mehr, als du glaubst. Das schützt dich vor Täuschung. Pass auf, dass es dich nicht vor Wundern schützt.');
    else if (st.geglaubt > st.geprueft) lines.push('Du glaubst mehr, als du prüfst. Das öffnet dir Türen. Pass auf, wer sie gebaut hat.');
    else lines.push('Du hältst Glauben und Zweifel im Gleichgewicht. Das ist selten. Das ist der dritte Weg.');
  }
  lines.push(`Dein Licht ist ${s.licht}. Dein Schatten heißt ${s.schatten}. Beide gehören dir.`);
  lines.push('Geh weiter, Suchender. Das Muster ist noch nicht fertig mit dir.');
  lines.push('(Ende von Kapitel 1. Die Reise geht weiter.)');
  return lines;
};

// Spiegelschrein: das Gesamtbild über die eigene Person
// ------------------------------------------------------------
G.SpiegelScene = () => {
  const seiten = G.buildGesamtbild();
  let i = 0, t = 0, fade = 0;
  return {
    translucent: true,
    enter() { G.doShake(3, 0.5); },
    update(dt) {
      t += dt; fade = Math.min(1, fade + dt * 2.2);
      if (G.input.pressed('action')) {
        i++; fade = 0;
        if (i >= seiten.length) { G.save(); G.popScene(); }
      }
      if (G.input.pressed('cancel')) { G.save(); G.popScene(); }
      if (Math.random() < 0.25) {
        G.spawnParticle({ x: Math.random() * G.W, y: G.H, vx: (Math.random() - 0.5) * 12,
          vy: -18 - Math.random() * 22, life: 5, fade: 2, color: G.pal.glow, size: 2, alpha: 0.4 });
      }
    },
    draw(c) {
      const p = G.pal;
      c.globalAlpha = 0.9; c.fillStyle = '#000'; c.fillRect(0, 0, G.W, G.H); c.globalAlpha = 1;
      G.drawParticles(c);
      c.strokeStyle = p.dim; c.lineWidth = 2; c.strokeRect(16, 16, G.W - 32, G.H - 32);
      c.fillStyle = p.main;
      [[18, 18], [G.W - 44, 18], [18, G.H - 44], [G.W - 44, G.H - 44]].forEach(([bx, by]) => {
        c.fillRect(bx, by, 26, 3); c.fillRect(bx, by, 3, 26);
      });
      G.textGlow(c, '◈', G.W / 2, G.SAFE_Y + 44, p.main, 24);
      G.text(c, 'DER SPIEGEL', G.W / 2, G.SAFE_Y + 78, p.main, 15, 'center');

      c.globalAlpha = fade;
      const txt = seiten[Math.min(i, seiten.length - 1)];
      const blocks = txt.split('\n');
      let y = G.SAFE_Y + 150;
      for (const b of blocks) {
        if (!b.trim()) { y += 14; continue; }
        const big = i === 0 && b === blocks[0];
        const lines = G.wrapText(c, b, G.W - 84, big ? 24 : 17);
        for (const l of lines) {
          G.text(c, l, G.W / 2, y, big ? p.bright : p.textBright, big ? 24 : 17, 'center');
          y += big ? 32 : 25;
        }
      }
      c.globalAlpha = 1;

      // Fortschrittsanzeige
      const n = G.state.fragmente.length, tot = G.FRAGMENTS.length;
      const bw = G.W - 100, bx = 50, by = G.H - 84;
      c.fillStyle = p.card; c.fillRect(bx, by, bw, 5);
      c.fillStyle = p.main; c.fillRect(bx, by, Math.round(bw * (n / tot)), 5);
      G.text(c, `${n} von ${tot} Fragmenten`, G.W / 2, by + 12, p.textDim, 13, 'center');
      if (fade >= 1 && Math.floor(t * 2) % 2 === 0) {
        G.text(c, i < seiten.length - 1 ? '[ OK ]' : '[ OK ] schließen', G.W / 2, G.H - 48, p.textDim, 14, 'center');
      }
    },
  };
};

let _storyByName = null;
Object.defineProperty(G, 'STORY_BY_NAME', {
  get() {
    if (_storyByName) return _storyByName;
    const out = {};
    for (const k in (G.STORY || {})) {
      const st = G.STORY[k];
      if (st && st.ort) out[st.ort] = st;
    }
    // Regionen ohne exakten Treffer auf den naechstbesten Ort abbilden
    for (const r of (G.BIGMAP ? G.BIGMAP.REGIONS : [])) {
      if (out[r.name]) continue;
      for (const k in (G.STORY || {})) {
        const st = G.STORY[k];
        if (st && st.ort && (r.name.indexOf(st.ort) >= 0 || st.ort.indexOf(r.name) >= 0)) { out[r.name] = st; break; }
      }
    }
    _storyByName = out;
    return out;
  },
});
